const VOICE = {urls:{}, queue:[], playing:null, log:[], rec:null, recKey:null, chunks:[], db:null, buf:{}, nextAt:0, srcs:[]};
/* which built-in clips answer each cue when nobody has recorded that line */
const KMAP = {go:['ready','set','go'], open:['ready','set','go'], resume:['go'], done:['@fin'], pickup:['@pick'], easeoff:['timeover'],
  next:['ready'], ten:['n10'], ahead:['correct'], ontarget:['correct'], behind:['hurry'], hold:['hold'], pr:['pr'], levelup:['levelup'], final:['final']};
function kvoiceOn(){ return (coachCfg().kvoice||'off')!=='off'; }
function kclip(k){ const c=coachCfg(), v=c.kvoice||'off'; if(v==='off') return null;
  if(k==='@fin') k=pick(['fin1','fin2','fin3','fin4']); if(k==='@pick') k=pick(['gogogo','powerup']);
  return (KVOICE[v]||KVOICE.a)[k]||KVOICE.a[k]||null; }
/* decode once, then schedule clips back to back on the audio clock */
async function playURL(url){
  if(!url) return false;
  unlockAudio();
  if(!audioCtx){ try{ const a=new Audio(url), pr=a.play(); if(pr && pr.catch) pr.catch(()=>{}); }catch(e){} return true; }
  try{
    let b = VOICE.buf[url];
    if(!b){ const ab = await (await fetch(url)).arrayBuffer(); b = await new Promise((res,rej)=>audioCtx.decodeAudioData(ab,res,rej)); VOICE.buf[url]=b; }
    const src = audioCtx.createBufferSource(); src.buffer=b; src.connect(audioCtx.destination);
    const at = Math.max(audioCtx.currentTime+0.02, VOICE.nextAt); src.start(at); VOICE.nextAt = at + b.duration + 0.06;
    VOICE.srcs.push(src); src.onended = () => { VOICE.srcs = VOICE.srcs.filter(x=>x!==src); };
  }catch(e){ return false; }
  return true;
}
function playKeys(list){ let any=false; for(const k of list){ const u=kclip(k); if(u){ playURL(u); any=true; } } return any; }
function vdb(){
  return new Promise((res, rej) => {
    if(VOICE.db) return res(VOICE.db);
    if(!window.indexedDB) return rej('no idb');
    const r = indexedDB.open('forge_voice', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('clips');
    r.onsuccess = () => { VOICE.db = r.result; res(VOICE.db); };
    r.onerror = () => rej(r.error);
  });
}
const vkey = k => P.id+':'+k;
async function vput(k, blob){ const db=await vdb(); return new Promise((res,rej)=>{ const t=db.transaction('clips','readwrite'); t.objectStore('clips').put(blob, vkey(k)); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function vdel(k){ const db=await vdb(); return new Promise((res)=>{ const t=db.transaction('clips','readwrite'); t.objectStore('clips').delete(vkey(k)); t.oncomplete=()=>res(); t.onerror=()=>res(); }); }
async function vloadAll(){
  for(const u of Object.values(VOICE.urls)) try{ URL.revokeObjectURL(u); }catch(e){}
  VOICE.urls = {};
  try{
    const db = await vdb();
    await new Promise(res => {
      const t = db.transaction('clips','readonly'), st = t.objectStore('clips'), c = st.openCursor();
      c.onsuccess = () => { const cur = c.result; if(!cur){ res(); return; }
        const ks = String(cur.key), i = ks.indexOf(':'), pid = ks.slice(0,i), k = ks.slice(i+1); if(pid===P.id && cur.value) VOICE.urls[k] = URL.createObjectURL(cur.value); cur.continue(); };
      c.onerror = () => res();
    });
  }catch(e){}
}
function chime(){
  try{
    if(!audioCtx) return;
    const mk=(t,f,v)=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+0.6); o.start(t); o.stop(t+0.65); };
    const now=audioCtx.currentTime; mk(now,659,0.18); mk(now+0.16,988,0.14);
  }catch(e){}
}
function showBubble(txt){
  let b = document.getElementById('coachbubble');
  if(!b){ b=document.createElement('div'); b.id='coachbubble'; document.body.appendChild(b); }
  b.innerHTML = '<span class="cbi">'+(Object.keys(VOICE.urls).length?'🎙':'♪')+'</span><span>'+esc(txt)+'</span>';
  b.classList.add('show'); clearTimeout(VOICE.bt); VOICE.bt = setTimeout(()=>b.classList.remove('show'), 4200);
}
function playClip(k){
  if(VOICE.urls[k]){ playURL(VOICE.urls[k]); return true; }
  if(KMAP[k]) return playKeys(KMAP[k]);
  return false;
}
/* the one entry point: text always shows; a recording plays if there is one */
function say(txt, force, key){
  const c = coachCfg();
  if(!force && (!c.on || c.style==='off')) return;
  VOICE.log.push({key:key||'', text:txt}); if(VOICE.log.length>60) VOICE.log.shift();
  showBubble(txt);
  if(!(key && playClip(key))) chime();
}
function motivate(){
  const recs = CUES.filter(q=>q.g==='Motivation' && VOICE.urls[q.k]);
  if(recs.length) return playClip(pick(recs).k);
  return false;
}
function shutUp(){ VOICE.queue=[]; VOICE.nextAt=0; for(const sN of VOICE.srcs){ try{ sN.stop(); }catch(e){} } VOICE.srcs=[]; }
function countIn(n){ if(n>=1 && n<=3) playKeys(['n'+n]); }
function speechOK(){ return true; }

/* ---------- recording ---------- */
async function recStart(k){
  if(VOICE.rec){ recStop(); return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast('This browser can\u2019t record audio'); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
    const mt = ['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    const r = new MediaRecorder(stream, mt?{mimeType:mt}:undefined);
    VOICE.rec = r; VOICE.recKey = k; VOICE.chunks = [];
    r.ondataavailable = e => { if(e.data && e.data.size) VOICE.chunks.push(e.data); };
    r.onstop = async () => {
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(VOICE.chunks, {type: r.mimeType||mt||'audio/mp4'});
      const key = VOICE.recKey; VOICE.rec=null; VOICE.recKey=null;
      if(blob.size > 800){ await vput(key, blob); await vloadAll(); toast('Saved'); playClip(key); } else toast('Too short — try again');
      render(true);
    };
    r.start(); render(true);
    VOICE.recTimer = setTimeout(()=>{ if(VOICE.rec) recStop(); }, 15000);
  }catch(e){ toast('Microphone blocked — allow it in Settings'); }
}
function recStop(){ clearTimeout(VOICE.recTimer); try{ if(VOICE.rec && VOICE.rec.state!=='inactive') VOICE.rec.stop(); }catch(e){} }

/* ---------- sharing a voice pack between phones ---------- */
async function voiceExport(){
  const out = {forge_voice:1, from:P.id, clips:{}};
  const db = await vdb();
  const list = await new Promise(res=>{ const arr=[]; const c=db.transaction('clips','readonly').objectStore('clips').openCursor();
    c.onsuccess=()=>{ const cur=c.result; if(!cur){ res(arr); return; } const ks=String(cur.key); if(ks.startsWith(P.id+':')) arr.push([ks.slice(P.id.length+1), cur.value]); cur.continue(); }; c.onerror=()=>res(arr); });
  for(const [k,b] of list){ out.clips[k] = await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(b); }); }
  const blob = new Blob([JSON.stringify(out)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = P.name.toLowerCase()+'-coach-voice.json'; a.setAttribute('download', a.download);
  document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(), 500);
  toast(list.length+' clips exported');
}
async function voiceImport(file){
  try{
    const o = JSON.parse(await file.text()); if(!o || !o.clips) throw 0;
    let n=0; const valid=allCues(); for(const [k,d] of Object.entries(o.clips)){ if(!valid.find(q=>q.k===k)) continue; const b = await (await fetch(d)).blob(); await vput(k,b); n++; }
    await vloadAll(); render(true); toast(n+' recordings added');
  }catch(e){ toast('That file isn\u2019t a coach voice pack'); }
}

/* one coaching line per exercise and stretch, read by a real person */
function moveCues(){
  const ex = [], seen = {};
  for(const k of P.liftOrder) for(const sl of slotList(k)) if(!seen[sl.id] && EXDB[sl.id]){ seen[sl.id]=1;
    const E=EXDB[sl.id]; ex.push({k:'ex:'+sl.id, g:'Your exercises', line:E.n+'. '+(E.cues&&E.cues[0]||'')}); }
  const st = []; const sseen = {};
  for(const k of P.liftOrder) for(const id of warmupFor(k).concat(cooldownFor(k))) if(!sseen[id] && STRETCHDB[id]){ sseen[id]=1;
    st.push({k:'st:'+id, g:'Your warm-ups and stretches', line:STRETCHDB[id].n+'. '+STRETCHDB[id].cue}); }
  return ex.concat(st);
}
function allCues(){ return CUES.concat(moveCues()); }
function rVoice(){
  const ALLC = allCues();
  const groups = [...new Set(ALLC.map(q=>q.g))];
  const done = ALLC.filter(q=>VOICE.urls[q.k]).length;
  return '<div class="row mb10"><button class="btn small ghost" data-a="nav" data-v="settings">&#8249; Settings</button></div>'+
    '<div class="pagehead"><div><div class="klabel">'+esc(P.name)+'</div><div class="disp h1">Coach voice</div></div><span class="chip '+(done===ALLC.length?'goodc':'dimc')+' num">'+done+' / '+ALLC.length+'</span></div>'+
    '<div class="card acc flat"><div class="fine" style="color:var(--text)">A real person reads each line once — you, your partner, a friend. Read it like you mean it. These recordings play during workouts, runs and stretches. Paces and splits show big on screen, so nobody has to read numbers. Lines you haven\u2019t recorded show on screen with a soft chime. No computer voice is ever used.</div>'+
      '<div class="steplab mt12">Game-announcer countdowns (optional)</div>'+
      '<div class="seg mt6">'+[['off','Off'],['a','Announcer A'],['b','Announcer B']].map(([v,l])=>'<button class="'+((coachCfg().kvoice||'off')===v?'on':'')+'" data-a="kv-set" data-v="'+v+'">'+l+'</button>').join('')+'</div>'+
      '<div class="row mt6" style="gap:6px;flex-wrap:wrap"><button class="chip" data-a="kv-try" data-v="go">▶ Ready, set, go</button><button class="chip" data-a="kv-try" data-v="final">▶ Final round</button><button class="chip" data-a="kv-try" data-v="done">▶ Finish</button></div>'+
      '<div class="fine mt6">Recorded voice clips from Kenney\u2019s Voiceover Pack (kenney.nl), public domain. Your own recordings below always play instead when you have them.</div>'+
      '<div class="grid2 mt12"><button class="btn" data-a="v-export">Send this voice</button><button class="btn" data-a="v-import">Add a voice file</button></div>'+
      '<div class="fine mt6">To record for someone else\u2019s phone: switch to their program in Settings, record here, tap Send this voice, and text them the file. They tap Add a voice file.</div></div>'+
    groups.map(g=>'<div class="card"><span class="klabel">'+esc(g)+'</span>'+
      (g==='Your exercises' ? '<div class="fine mt6">Plays when that exercise comes up in your workout. Read the name, then the cue, like you\u2019re standing next to her.</div>' :
       g==='Your warm-ups and stretches' ? '<div class="fine mt6">Plays when that move starts in the warm-up, cool-down or stretch player.</div>' : '')+
      ALLC.filter(q=>q.g===g).map(q=>{
        const has = !!VOICE.urls[q.k], live = VOICE.recKey===q.k;
        return '<div class="vrow'+(live?' live':'')+'"><div class="vline">'+esc(q.line)+'</div><div class="vbtns">'+
          '<button class="chip '+(live?'badc':'accc')+'" data-a="v-rec" data-k="'+q.k+'">'+(live?'■ Stop':(has?'● Redo':'● Record'))+'</button>'+
          (has? '<button class="chip" data-a="v-play" data-k="'+q.k+'">▶</button><button class="chip dimc" data-a="v-del" data-k="'+q.k+'">✕</button>' : '')+
        '</div></div>'; }).join('')+'</div>').join('')+
    '<div style="height:16px"></div>';
}
document.addEventListener('click', function(e){
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a, k=b.dataset.k;
  if(a==='kv-set'){ coachCfg().kvoice=b.dataset.v; save(); render(true); if(b.dataset.v!=='off'){ unlockAudio(); shutUp(); playKeys(['go']); } }
  else if(a==='kv-try'){ unlockAudio(); shutUp(); playClip(b.dataset.v); }
  else if(a==='v-rec'){ unlockAudio(); recStart(k); }
  else if(a==='v-play'){ shutUp(); playClip(k); }
  else if(a==='v-del'){ vdel(k).then(vloadAll).then(()=>render(true)); }
  else if(a==='v-export'){ voiceExport(); }
  else if(a==='v-import'){ const f=$('#voicefile'); if(f){ f.value=''; f.click(); } }
});
Object.assign(window,{VOICE,CUES,say,playClip,KVOICE,KMAP,kclip,playKeys,moveCues,allCues});
document.addEventListener('change', function(e){ if(e.target && e.target.id==='voicefile' && e.target.files && e.target.files[0]) voiceImport(e.target.files[0]); });

</script>
<script>
'use strict';
/* =================== WORKOUT PLAYER =================== */
function buildActive(dayKey){
  const ex = slotList(dayKey).map(s=>{
    const pr = S.exercisePR[s.id];
    return {
      exerciseId:s.id, targetSets:s.sets, lo:s.lo, hi:s.hi, side:s.side,
      rest: s.comp ? S.settings.restCompound : S.settings.restIso,
      sets:[], complete:false, editIdx:null,
      draft:{ weight: (pr && pr.lastWeight) || 0, reps: s.lo, rpe:'', warm:false }
    };
  });
  return {id:uid(), date:todayS(), dayKey, startedAt:Date.now(), notes:'', warmupDone:false, exercises:ex,
          warm:warmupFor(dayKey), cool:cooldownFor(dayKey), warmDone:{}, coolDone:{}};
}
/* one stretch as a card inside the workout */
function stretchRow(a, id, part){
  const st=STRETCHDB[id]; if(!st) return '';
  const done = !!(a[part+'Done']||{})[id];
  return '<div class="strow stx'+(done?' done':'')+'">'+
    '<span class="stth">'+figSVG(id,{mode:'still',end:1})+'</span>'+
    '<span class="stm"><b>'+esc(st.n)+'</b><span>'+(st.dyn?'Keep moving · ':'Hold · ')+holdTxt(id,part)+(st.sides?' each side':'')+' · '+esc(st.area.join(', '))+'</span></span>'+
    '<button class="chip" data-a="pl-st-play" data-id="'+id+'" data-part="'+part+'" aria-label="Start">▶</button>'+
    '<button class="chip'+(done?' goodc':' dimc')+'" data-a="pl-st-done" data-id="'+id+'" data-part="'+part+'" aria-label="Mark done">'+(done?'✓':'')+'</button>'+
  '</div>';
}
function stretchSection(a, part, num, title, blurb){
  const ids = a[part]||[]; if(!ids.length) return '';
  const done = ids.filter(id=>(a[part+'Done']||{})[id]).length;
  const all = done===ids.length;
  return '<div class="card'+(all?' goodc':'')+'" id="sec-'+part+'">'+
    '<div class="between"><span class="klabel'+(all?' good-t':'')+'">'+num+' · '+title+'</span>'+
      '<span class="chip '+(all?'goodc':'dimc')+' num">'+done+' / '+ids.length+(all?' ✓':'')+'</span></div>'+
    (all? '' : '<div class="fine mt6">'+blurb+'</div>')+
    ids.map(id=>stretchRow(a,id,part)).join('')+
    (all? '' : '<button class="btn mt10" data-a="pl-st-all" data-part="'+part+'">▶ Run the whole '+title.toLowerCase()+' · '+stretchMinutes(ids.filter(id=>!(a[part+'Done']||{})[id]),part)+' min</button>')+
  '</div>';
}
function sessionPhase(a){
  const w=(a.warm||[]), c=(a.cool||[]);
  const wd = w.every(id=>(a.warmDone||{})[id]);
  const liftDone = a.exercises.length && a.exercises.every(e=>e.complete || workingSets(e).length>=e.targetSets);
  const cd = c.every(id=>(a.coolDone||{})[id]);
  if(!wd) return 0; if(!liftDone) return 1; if(!cd) return 2; return 3;
}
function startDay(key){
  const go = ()=>{ S.active = buildActive(key); save(); nav('player'); };
  if(S.active){
    confirmSheet('Replace workout in progress?',
      'You have an unfinished '+DAY_META[S.active.dayKey].name+' session. Starting a new one discards it.',
      'Discard &amp; start new', ()=>{ closeSheet(); go(); });
  } else go();
}

/* the weight/band/reps controls, matched to how the movement is loaded */
function loadRow(ex, i, wv, rv, d){
  const L = loadOf(ex.exerciseId);
  const timed = L==='time', st = timed?5:1;
  const repsCell =
    '<div><div class="steplab">'+(timed?'Seconds':'Reps')+(ex.side?' · per side':'')+'</div><div class="step">'+
      '<button data-a="pl-step" data-i="'+i+'" data-f="r" data-d="-'+st+'">−'+st+'</button>'+
      '<div class="stepmid"><input id="r-'+i+'" type="number" inputmode="numeric" step="'+st+'" min="0" value="'+rv+'" data-draft="reps" data-i="'+i+'">'+(timed?'<span class="unit">SEC</span>':'')+'</div>'+
      '<button data-a="pl-step" data-i="'+i+'" data-f="r" data-d="'+st+'">+'+st+'</button></div></div>';
  const weightCell = (lab) =>
    '<div><div class="steplab">'+lab+'</div><div class="step">'+
      '<button data-a="pl-step" data-i="'+i+'" data-f="w" data-d="-5">−5</button>'+
      '<div class="stepmid"><input id="w-'+i+'" type="number" inputmode="decimal" step="2.5" min="0" value="'+wv+'" data-draft="weight" data-i="'+i+'"><span class="unit">LB</span></div>'+
      '<button data-a="pl-step" data-i="'+i+'" data-f="w" data-d="5">+5</button></div></div>';

  if(L==='db') return '<div class="edrow">'+weightCell('Weight · lb')+repsCell+'</div>';
  if(timed) return '<input id="w-'+i+'" type="hidden" value="0"><div class="edrow one">'+repsCell+'</div>';

  if(L==='band'){
    const cur = d.band || (lastSets(ex.exerciseId)||{sets:[{}]}).sets[0].band || 'Medium';
    return '<div class="bandsel">'+
      '<div class="steplab">Band tension</div>'+
      '<div class="seg">'+BANDS.map(b=>'<button class="'+(b===cur?'on':'')+'" data-a="pl-band" data-i="'+i+'" data-b="'+b+'">'+b+'</button>').join('')+'</div>'+
      '<input id="w-'+i+'" type="hidden" value="0">'+
    '</div><div class="edrow one">'+repsCell+'</div>';
  }

  // bodyweight — reps only, with optional extra load tucked behind a chip
  const showLoad = ex.showLoad || wv>0;
  return '<div class="edrow'+(showLoad?'':' one')+'">'+
      (showLoad ? weightCell('Extra load · lb') : '<input id="w-'+i+'" type="hidden" value="0">')+
      repsCell+
    '</div>'+
    '<button class="chip dimc mt6" data-a="pl-addload" data-i="'+i+'">'+
      (showLoad ? '− Just bodyweight' : '+ Holding a dumbbell?')+'</button>';
}

function exCard(ex, i){
  const E = EXDB[ex.exerciseId];
  const working = workingSets(ex).length;
  const editing = ex.editIdx!=null;
  const hint = hintFor(ex.exerciseId, ex.lo, ex.hi);
  const prev = lastSets(ex.exerciseId);
  const LT = loadOf(ex.exerciseId);
  const firstTxt = LT==='time' ? 'First time — hold '+ex.lo+' s with perfect position, then build.'
                 : LT==='bw'   ? 'First time — get '+ex.lo+' clean reps before you add anything.'
                 : LT==='band' ? 'First time — pick a band you can control for '+ex.lo+' reps.'
                 :               'First time — pick a weight you own for '+ex.lo+' clean reps.';
  let prevTxt = prev ? 'Last ('+shortD(prev.date)+'): '+prev.sets.map(s=>setShort(ex.exerciseId,s)).join(' · ') : firstTxt;
  if(ex.exerciseId==='bone_jumps' && P.id==='forger' && !runReadyOK()) prevTxt = 'Run-ready check not finished — do fast calf raises × 20 instead, or skip this slot.';

  let wc=0;
  const rows = ex.sets.map((s,j)=>{
    if(!s.warmup) wc++;
    if(editing && ex.editIdx===j) return '<div class="fine mt6" style="padding-left:4px">Editing set below…</div>';
    return '<button class="setline'+(s.warmup?' warmset':'')+'" data-a="pl-edit" data-i="'+i+'" data-j="'+j+'">'+
      '<span class="sl-n">'+(s.warmup?'W':wc)+'</span>'+
      '<span class="sl-main num">'+esc(setLabel(ex.exerciseId,s))+'</span>'+
      (s.rpe?'<span class="sl-rpe num">RPE '+s.rpe+'</span>':'')+
      '<span class="sl-edit">✎</span></button>';
  }).join('');

  let editor='';
  const showEditor = !ex.complete || editing;
  if(showEditor){
    const d = ex.draft||{};
    const wv = (d.weight!=null? d.weight : 0);
    const rv = (d.reps!=null? d.reps : ex.lo);
    const rpev = d.rpe||'';
    const warm = !!d.warm;
    const nextN = working+1;
    const g = prev ? (prev.sets[Math.min(working, prev.sets.length-1)]) : null;
    const rpeOpts = ['','6','7','8','9','10'].map(v=>'<option value="'+v+'"'+(String(rpev)===v?' selected':'')+'>'+(v?('RPE '+v):'RPE —')+'</option>').join('');
    editor =
    '<div class="editor">'+
      '<div class="edtop">'+
        '<span class="chip">'+(editing?'Edit set':'Set '+nextN)+'</span>'+
        (g && !editing ? '<span class="chip dimc num">last '+esc(setShort(ex.exerciseId,g))+'</span>':'')+
        '<button class="chip'+(warm?' warnc':'')+'" data-a="pl-warm" data-i="'+i+'">Warm-up'+(warm?' ✓':'')+'</button>'+
        '<select class="rpesel num" id="rpe-'+i+'" data-draft="rpe" data-i="'+i+'">'+rpeOpts+'</select>'+
      '</div>'+
      loadRow(ex, i, wv, rv, d)+
      '<button class="btn goodb" data-a="pl-log" data-i="'+i+'">'+(editing?'Update set':'Log set ✓')+'</button>'+
      (editing?'<div class="row mt10"><button class="btn small ghost" data-a="pl-canceledit" data-i="'+i+'">Cancel</button><button class="btn small danger" data-a="pl-delset" data-i="'+i+'">Delete set</button></div>':'')+
    '</div>';
  }

  return '<div class="excard'+(ex.complete?' donex':'')+'" id="exc-'+i+'">'+
    '<button class="exname" data-a="ex-open" data-id="'+ex.exerciseId+'" data-b="player">'+
      '<span class="numchip">'+(i+1)+'</span>'+figThumb(ex.exerciseId)+'<span class="xt">'+esc(E.n)+'</span><span class="xi">form ›</span></button>'+
    '<div class="exmeta"><span class="chip dimc num">'+ex.targetSets+' × '+ex.lo+'–'+ex.hi+(ex.side?' / side':'')+'</span>'+
      '<span class="chip dimc num">rest '+fmtRest(ex.rest)+'</span>'+
      (hint?'<span class="badge '+hint.cls+'">'+hint.label+'</span>':'')+
      (ex.complete?'<span class="chip goodc">Done ✓</span>':'')+'</div>'+
    '<div class="prevline num">'+esc(prevTxt)+'</div>'+
    rows + editor +
    '<div class="exfoot"><span class="fine num">'+working+' / '+ex.targetSets+' working sets</span>'+
      (ex.complete
        ? '<button class="chip" data-a="pl-addset" data-i="'+i+'">+ Add set</button>'
        : '<button class="chip goodc" data-a="pl-doneex" data-i="'+i+'">Mark done ✓</button>')+
    '</div></div>';
}

function phaseBar(a){
  const ph = sessionPhase(a);
  const step = (i,l) => '<span class="phs'+(ph>i?' done':ph===i?' now':'')+'"><i>'+(ph>i?'✓':i+1)+'</i>'+l+'</span>';
  return '<div class="phasebar2">'+step(0,'Warm-up')+step(1,P.id==='forger'?'Workout':'Lift')+step(2,'Cool-down')+'</div>';
}
function rPlayer(){
  const a = S.active;
  if(!a) return '<div class="emptystate card"><div class="disp big">No workout running</div><div class="sub mt6">Start one from Home or the Program tab.</div><button class="btn primary mt14" data-a="nav" data-v="home">Home</button></div>';
  const cards = a.exercises.map(exCard).join('');
  return ''+
  '<div class="plhead">'+
    '<button class="btn small ghost" data-a="nav" data-v="home">‹</button>'+
    '<div class="plmid"><span class="klabel">'+esc(DAY_META[a.dayKey].name)+'</span><span class="plclock num" id="pl-clock">'+fmtClock(Date.now()-a.startedAt)+'</span></div>'+
    '<button class="btn small primary" data-a="pl-finish">Finish</button>'+
  '</div>'+
  phaseBar(a)+
  stretchSection(a,'warm','1','Warm-up','Movement prep. Keep moving for each count — nothing is held yet. Tap ▶ for a guided timer, or ✓ if you already did it.')+
  '<div class="klabel" style="margin:14px 4px 6px">2 · '+(P.id==='forger'?'Workout':'Lift')+'</div>'+
  cards+
  '<div class="fine" style="margin:2px 4px 12px">Stop every set 1–2 reps before failure. All sets at the top of the range with clean form → progress next time.</div>'+
  stretchSection(a,'cool','3','Cool-down','Static holds while the muscles are warm. 30 s a side, slow breathing, no bouncing.')+
  '<button class="btn primary" data-a="pl-finish">Finish workout</button>'+
  '<button class="btn ghost danger mt10" data-a="pl-discard" style="border:0">Discard workout</button>'+
  '<div style="height:16px"></div>';
}

function sheetFinish(){
  const a=S.active; if(!a) return;
  const mins = Math.max(1, Math.round((Date.now()-a.startedAt)/60000));
  let setsN=0, vol=0, repsN=0;
  for(const ex of a.exercises){ const ws=workingSets(ex); setsN+=ws.length; for(const s of ws){ vol+=(s.weight||0)*(s.reps||0); repsN+=(s.reps||0); } }
  const wN=(a.warm||[]).length, wD=(a.warm||[]).filter(id=>(a.warmDone||{})[id]).length;
  const cN=(a.cool||[]).length, cD=(a.cool||[]).filter(id=>(a.coolDone||{})[id]).length;
  const coolLeft=(a.cool||[]).filter(id=>!(a.coolDone||{})[id]);
  openSheet('<div class="disp h2">Finish '+esc(DAY_META[a.dayKey].name)+'</div>'+
   '<div class="statgrid mt14">'+
    '<div class="stat"><div class="sv num">'+mins+'</div><div class="sk">Minutes</div></div>'+
    '<div class="stat"><div class="sv num">'+setsN+'</div><div class="sk">Work sets</div></div>'+
    '<div class="stat"><div class="sv num">'+fmtN(vol)+'</div><div class="sk">Volume lb</div></div>'+
    '<div class="stat"><div class="sv num">'+repsN+'</div><div class="sk">Total reps</div></div>'+
   '</div>'+
   '<div class="row mt10" style="gap:8px"><span class="chip '+(wD===wN?'goodc':'dimc')+' num">Warm-up '+wD+'/'+wN+'</span>'+
     '<span class="chip '+(cD===cN?'goodc':'dimc')+' num">Cool-down '+cD+'/'+cN+'</span></div>'+
   '<div class="mt14"><span class="klabel flabel">Notes (optional)</span><textarea class="field" id="fin-notes" placeholder="Energy, tweaks, PRs…">'+esc(a.notes||'')+'</textarea></div>'+
   (coolLeft.length
     ? '<button class="btn primary mt14" data-a="fin-save-stretch">Save &amp; cool down · '+stretchMinutes(coolLeft)+' min left</button>'+
       '<button class="btn mt10" data-a="fin-save">Save without the cool-down</button>'
     : '<button class="btn primary mt14" data-a="fin-save">Save workout</button>')+
   '<button class="btn ghost mt10" data-a="sheet-close">Keep training</button>');
}
function finishSave(andStretch){
  const a=S.active; if(!a) return;
  window.__prsBefore = JSON.parse(JSON.stringify(S.exercisePR||{}));
  const dayKey=a.dayKey;
  a.notes = ($('#fin-notes')&&$('#fin-notes').value.trim())||'';
  const rec = {
    id:a.id, date:a.date, dayKey:a.dayKey, startedAt:a.startedAt, finishedAt:Date.now(),
    durationMin: Math.max(1, Math.round((Date.now()-a.startedAt)/60000)),
    notes:a.notes,
    exercises: a.exercises.filter(e=>e.sets.length).map(e=>({exerciseId:e.exerciseId, sets:e.sets.map(s=>({weight:s.weight,reps:s.reps,rpe:s.rpe||null,warmup:!!s.warmup}))}))
  };
  rec.volume = sessionVolume(rec);
  rec.warm = (a.warm||[]).filter(id=>(a.warmDone||{})[id]);
  rec.cool = (a.cool||[]).filter(id=>(a.coolDone||{})[id]);
  const coolLeft = (a.cool||[]).filter(id=>!(a.coolDone||{})[id]);
  const stMin = stretchMinutes(rec.warm.concat(rec.cool));
  if(stMin){ S.stretches=S.stretches||[]; S.stretches.push({date:todayS(), kind:'session', min:stMin}); }
  S.workouts.push(rec);
  rebuildPRs();
  S.active=null; save();
  stopRest(); closeSheet();
  toast('Saved — '+fmtN(rec.volume)+' lb moved in '+rec.durationMin+' min');
  { const prsBefore = JSON.stringify(window.__prsBefore||{}); if(prsBefore!==JSON.stringify(S.exercisePR) && window.__prsBefore) playClip('pr'); else playClip('done'); }
  if(andStretch && coolLeft.length){ UI.view='home'; stretchStart(coolLeft, 'Cool-down', 'home', 'cooldown'); }
  else nav('home');
}

/* =================== REST TIMER =================== */
const RT = {until:0, total:0, label:'', doneAt:0};
let audioCtx=null;
function unlockAudio(){ try{ if(!audioCtx && (window.AudioContext||window.webkitAudioContext)) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); }catch(e){} }
function beep(){
  try{
    if(!audioCtx) return;
    const mk=(t,f)=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.4); o.start(t); o.stop(t+0.45); };
    const now=audioCtx.currentTime; mk(now,880); mk(now+0.28,1175);
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([180,90,180]); }catch(e){}
}
function startRest(sec,label){
  RT.until=Date.now()+sec*1000; RT.total=sec*1000; RT.label=label; RT.doneAt=0;
  $('#restbar').hidden=false; $('#restbar').classList.remove('done'); tickRest();
}
function stopRest(){ RT.until=0; RT.doneAt=0; $('#restbar').hidden=true; }
function tickRest(){
  const bar=$('#restbar'); if(bar.hidden && !RT.until) return;
  const now=Date.now();
  if(RT.until){
    const left=RT.until-now;
    if(left<=0){ RT.until=0; RT.doneAt=now; bar.classList.add('done');
      $('#rb-time').textContent='GO'; $('#rb-k').textContent='Rest over'; $('#rb-fill').style.width='100%'; beep(); return; }
    $('#rb-time').textContent=fmtClock(left+999);
    $('#rb-k').textContent='Rest';
    $('#rb-ex').textContent=RT.label;
    $('#rb-fill').style.width=Math.max(0,(left/RT.total*100))+'%';
    bar.hidden=false;
  } else if(RT.doneAt){
    $('#rb-ex').textContent=RT.label;
    if(now-RT.doneAt>6000){ stopRest(); bar.classList.remove('done'); }
  }
}
setInterval(tickRest,300);
setInterval(()=>{ const c=$('#pl-clock'); if(c && S && S.active) c.textContent=fmtClock(Date.now()-S.active.startedAt); },1000);

/* =================== ACTIONS =================== */
function num(id, fb){ const el=$('#'+id); if(!el) return fb; const v=parseFloat(el.value); return isNaN(v)? fb : v; }

document.addEventListener('pointerdown', unlockAudio, {once:true, capture:true});
document.addEventListener('click', function(e){
  const b = e.target.closest('[data-a]');
  if(e.target.id==='modal'){ closeSheet(); return; }
  if(!b) return;
  const a=b.dataset.a, D=b.dataset;
  switch(a){
    case 'nav': nav(D.v); break;
    case 'sheet-close': closeSheet(); break;
    case 'confirm-yes': { const f=confirmFn; confirmFn=null; if(f) f(); break; }

    /* home / schedule */
    case 'home-start': startDay(D.k); break;
    case 'pl-resume': nav('player'); break;
    case 'wk-day': {
      const type=typeFor(D.d), kind=DAY_META[type].kind;
      if(kind==='lift'){ UI.prevDay=type; nav('preview'); }
      else if(kind==='cardio'){ UI.prevDay='cardio'; nav('preview'); }
      else toast('Rest day — walk, stretch, eat.');
      break; }
    case 'wt-open': sheetWeight(); break;
    case 'wt-save': {
      const v=num('wt-in',null);
      if(v==null||v<=0){ toast('Enter a weight'); break; }
      weightUpsert(todayS(), Math.round(v*10)/10); save(); closeSheet(); render(true);
      const avg=weekAvgWeight(todayS());
      toast('Logged '+trimW(v)+' lb'+(avg?' · week avg '+trimW(avg):'')); break; }

    /* program */
    case 'prog-open': UI.prevDay=D.k; nav('preview'); break;
    case 'swap-open': sheetSwap(D.k, +D.slot); break;
    case 'swap-pick': {
      const k=D.k, slot=+D.slot, id=D.id;
      const base=PROGRAM[k].slots[slot].id;
      S.overrides[k]=S.overrides[k]||{};
      if(id===base) delete S.overrides[k][slot]; else S.overrides[k][slot]=id;
      if(!Object.keys(S.overrides[k]).length) delete S.overrides[k];
      save(); closeSheet(); render(true);
      toast(id===base?'Back to the program exercise':'Swapped to '+EXDB[id].n); break; }

    /* exercise detail */
    case 'ex-open': UI.exId=D.id; UI.exBack=D.b||UI.view; UI.figShot=!!photoOf(D.id); UI.figView='v1'; nav('exercise'); break;
    case 'ex-back': nav(['player','preview','program','progress','home'].includes(UI.exBack)?UI.exBack:'home'); break;

    /* bike */
    case 'bike-open': sheetBike(); break;
    case 'bike-save': {
      const min=Math.round(num('bk-min',25));
      const notes=($('#bk-notes')&&$('#bk-notes').value.trim())||'';
      S.workouts.push({id:uid(), date:todayS(), dayKey:'cardio', startedAt:Date.now(), finishedAt:Date.now(),
        durationMin:min, volume:0, notes, exercises:[{exerciseId:'easy_bike', sets:[]}]});
      save(); closeSheet(); render(); toast('Ride logged — '+min+' min'); break; }

    /* player */
    case 'pl-warmup': if(S.active){ S.active.warmupDone=!S.active.warmupDone; save(); render(true);} break;
    case 'pl-step': {
      const el=$('#'+(D.f==='w'?'w':'r')+'-'+D.i); if(!el) break;
      const step=+D.d; let v=parseFloat(el.value); if(isNaN(v)) v=0;
      v=Math.max(0, v+step); if(D.f==='r') v=Math.round(v);
      el.value = (v%1===0? v : v.toFixed(1));
      const ex=S.active&&S.active.exercises[+D.i];
      if(ex){ ex.draft=ex.draft||{}; ex.draft[D.f==='w'?'weight':'reps']=v; save(); }
      break; }
    case 'pl-warm': {
      const ex=S.active&&S.active.exercises[+D.i]; if(!ex) break;
      ex.draft=ex.draft||{}; ex.draft.warm=!ex.draft.warm; save(); render(true); break; }
    case 'pl-log': {
      const i=+D.i, ex=S.active&&S.active.exercises[i]; if(!ex) break;
      const w=num('w-'+i,0), r=Math.round(num('r-'+i,0));
      const rpeEl=$('#rpe-'+i); const rpe=rpeEl&&rpeEl.value? +rpeEl.value : null;
      if(!(r>0)){ toast(loadOf(ex.exerciseId)==='time'?'Enter the seconds held':'Enter reps first'); break; }
      const warm=!!(ex.draft&&ex.draft.warm);
      const entry={weight:Math.max(0,w), reps:r, rpe, warmup:warm};
      if(loadOf(ex.exerciseId)==='band') entry.band = (ex.draft&&ex.draft.band) || 'Medium';
      if(ex.editIdx!=null){ ex.sets[ex.editIdx]=entry; ex.editIdx=null; }
      else{
        ex.sets.push(entry);
        if(!warm && workingSets(ex).length>=ex.targetSets){ ex.complete=true; ex.justDone=true; }
      }
      ex.draft={weight:entry.weight, reps:entry.reps, rpe:'', warm:false, band:entry.band};
      save(); render(true);
      startRest(ex.rest, EXDB[ex.exerciseId].n);
      if(ex.justDone){ delete ex.justDone; const nx=S.active.exercises.find(e=>!e.complete);
        if(nx && VOICE.urls['ex:'+nx.exerciseId]){ shutUp(); playClip('ex:'+nx.exerciseId); showBubble('Next up · '+EXDB[nx.exerciseId].n); } }
      break; }
    case 'pl-st-done': {
      const a=S.active; if(!a) break;
      const k=D.part+'Done'; a[k]=a[k]||{}; a[k][D.id]=!a[k][D.id]; save(); render(true);
      if(D.part==='warm' && (a.warm||[]).every(id=>a.warmDone[id])){ const nx=a.exercises.find(e=>!e.complete); if(nx && VOICE.urls['ex:'+nx.exerciseId]){ playClip('ex:'+nx.exerciseId); showBubble('First up · '+EXDB[nx.exerciseId].n); } }
      break; }
    case 'pl-st-play': {
      const a=S.active; if(!a) break;
      const part=D.part, id=D.id;
      ST.onDone = ids => { const k=part+'Done'; a[k]=a[k]||{}; for(const x of ids) a[k][x]=true; save(); };
      stretchStart([id], part==='warm'?'Warm-up':'Cool-down', 'player', part);
      break; }
    case 'pl-st-all': {
      const a=S.active; if(!a) break;
      const part=D.part, ids=(a[part]||[]).filter(id=>!(a[part+'Done']||{})[id]);
      if(!ids.length) break;
      ST.onDone = done => { const k=part+'Done'; a[k]=a[k]||{}; for(const x of done) a[k][x]=true; save(); };
      stretchStart(ids, part==='warm'?'Warm-up':'Cool-down', 'player', part);
      break; }
    case 'pl-band': {
      const ex=S.active&&S.active.exercises[+D.i]; if(!ex) break;
      ex.draft=ex.draft||{}; ex.draft.band=D.b; save(); render(true); break; }
    case 'pl-addload': {
      const ex=S.active&&S.active.exercises[+D.i]; if(!ex) break;
      ex.showLoad=!ex.showLoad;
      if(!ex.showLoad && ex.draft) ex.draft.weight=0;
      save(); render(true); break; }
    case 'pl-edit': {
      const ex=S.active&&S.active.exercises[+D.i]; if(!ex) break;
      const s=ex.sets[+D.j]; if(!s) break;
      ex.editIdx=+D.j;
      ex.draft={weight:s.weight, reps:s.reps, rpe:s.rpe||'', warm:!!s.warmup, band:s.band};
      if(s.weight>0) ex.showLoad=true;
      save(); render(true); break; }
    case 'pl-canceledit': {
      const ex=S.active&&S.active.exercises[+D.i]; if(!ex) break;
      ex.editIdx=null; ex.draft.warm=false; save(); render(true); break; }
    case 'pl-delset': {
      const ex=S.active&&S.active.exercises[+D.i]; if(!ex||ex.editIdx==null) break;
      ex.sets.splice(ex.editIdx,1); ex.editIdx=null;
      if(workingSets(ex).length<ex.targetSets) ex.complete=false;
      save(); render(true); toast('Set deleted'); break; }
    case 'pl-doneex': {
      const ex=S.active&&S.active.exercises[+D.i]; if(!ex) break;
      ex.complete=true; ex.editIdx=null; save(); render(true); break; }
    case 'pl-addset': {
      const ex=S.active&&S.active.exercises[+D.i]; if(!ex) break;
      ex.complete=false; save(); render(true); break; }
    case 'pl-finish': sheetFinish(); break;
    case 'fin-save': finishSave(false); break;
    case 'fin-save-stretch': finishSave(true); break;
    case 'pl-discard':
      confirmSheet('Discard this workout?','All sets from this session will be lost. Saved history is untouched.','Discard workout',
        ()=>{ S.active=null; save(); stopRest(); closeSheet(); nav('home'); toast('Workout discarded'); });
      break;

    /* rest bar */
    case 'rest-add': if(RT.until){ RT.until+=15000; RT.total+=15000; tickRest(); } else { startRest(15, RT.label||''); } break;
    case 'rest-skip': stopRest(); $('#restbar').classList.remove('done'); break;

    /* food */
    case 'fd-prev': UI.foodDate=addD(UI.foodDate,-1); render(); break;
    case 'fd-next': if(UI.foodDate<todayS()){ UI.foodDate=addD(UI.foodDate,1); render(); } break;
    case 'qk-add': {
      const m=S.quickMeals[+D.i]; if(!m) break;
      const f=foodWrite(UI.foodDate);
      const hit=f.items.find(it=>it.name===m.name);
      if(hit) hit.qty=(hit.qty||1)+1;
      else f.items.push({name:m.name,kcal:m.kcal,p:m.p,c:m.c,f:m.f,qty:1});
      save(); render(true); toast('Added · '+m.p+' g protein'); break; }
    case 'qk-edit': sheetMealEdit(+D.i); break;
    case 'sm-log': {
      const dd=UI.foodDate, wd=(parseD(dd).getDay()+6)%7;
      const m = D.k==='bf' ? SHARED_BREAKFASTS[BF_ROT[wd]] : SHARED_DINNERS[wd];
      const mine = m[P.id], nm = (D.k==='bf'?'Breakfast':'Dinner')+' · '+m.name;
      const f=foodWrite(dd);
      if(!f.items.some(it=>it.name===nm)) f.items.push({name:nm,kcal:mine.kcal,p:mine.p,c:mine.c,f:mine.f,qty:1});
      save(); render(true); toast('Logged · '+mine.p+' g protein'); break; }
    case 'sm-week': UI.mealsOpen=!UI.mealsOpen; render(true); break;
    case 'qk-save': {
      const m=S.quickMeals[+D.i]; if(!m) break;
      const nm=($('#qm-name')&&$('#qm-name').value.trim());
      if(nm) m.name=nm;
      m.kcal=Math.max(0,Math.round(num('qm-kcal',m.kcal)));
      m.p=Math.max(0,Math.round(num('qm-p',m.p)));
      m.c=Math.max(0,Math.round(num('qm-c',m.c)));
      m.f=Math.max(0,Math.round(num('qm-f',m.f)));
      save(); closeSheet(); render(true); toast('Meal updated'); break; }
    case 'fd-water': {
      const f=foodWrite(UI.foodDate);
      const ml=+D.ml;
      f.waterL = ml===0 ? 0 : Math.round(((f.waterL||0)+ml/1000)*100)/100;
      save(); render(true); break; }
    case 'fd-custtoggle': UI.custOpen=!UI.custOpen; render(true); break;
    case 'fd-addcustom': {
      const nm=($('#cf-name')&&$('#cf-name').value.trim());
      if(!nm){ toast('Give it a name'); break; }
      const it={name:nm, kcal:Math.max(0,Math.round(num('cf-kcal',0))), p:Math.max(0,Math.round(num('cf-p',0))),
                c:Math.max(0,Math.round(num('cf-c',0))), f:Math.max(0,Math.round(num('cf-f',0))), qty:1};
      foodWrite(UI.foodDate).items.push(it);
      S.customRecents=[{name:it.name,kcal:it.kcal,p:it.p,c:it.c,f:it.f}]
        .concat(S.customRecents.filter(r=>r.name!==it.name)).slice(0,8);
      save(); render(true); toast('Added '+it.name); break; }
    case 'fd-recent': {
      const r=S.customRecents[+D.i]; if(!r) break;
      const f=foodWrite(UI.foodDate);
      const hit=f.items.find(it=>it.name===r.name);
      if(hit) hit.qty=(hit.qty||1)+1; else f.items.push({name:r.name,kcal:r.kcal,p:r.p,c:r.c,f:r.f,qty:1});
      save(); render(true); toast('Added '+r.name); break; }
    case 'fd-del': {
      const f=foodWrite(UI.foodDate); f.items.splice(+D.i,1); save(); render(true); break; }

    /* progress */
    case 'wo-open': sheetWorkout(D.id); break;
    case 'wo-del':
      confirmSheet('Delete this workout?','It disappears from history, PRs, and volume totals. This cannot be undone.','Delete workout',
        ()=>{ S.workouts=S.workouts.filter(w=>w.id!==D.id); rebuildPRs(); save(); closeSheet(); render(); toast('Workout deleted'); });
      break;

    /* settings */
    case 'theme': S.settings.theme=D.t; applyTheme(); save(); render(true); break;
    case 'exp-dl': {
      try{
        const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
        const url=URL.createObjectURL(blob);
        const aEl=document.createElement('a');
        aEl.href=url; aEl.download='forge-backup-'+todayS().replace(/-/g,'')+'.json';
        document.body.appendChild(aEl); aEl.click(); aEl.remove();
        setTimeout(()=>URL.revokeObjectURL(url),4000); toast('Backup downloading');
      }catch(err){ sheetExportShow(); }
      break; }
    case 'exp-show': sheetExportShow(); break;
    case 'imp-file': $('#importfile').click(); break;
    case 'imp-paste': sheetImportPaste(); break;
    case 'imp-paste-go': { const ta=$('#imp-ta'); if(ta) doImport(ta.value); break; }
    case 'wk-reset':
      confirmSheet('Reset current week?','Deletes this week&#8217;s logged workouts and clears the strip. Food logs and bodyweight stay.','Reset week',
        ()=>{ const days=new Set(weekDates(todayS()));
          S.workouts=S.workouts.filter(w=>!days.has(w.date));
          if(S.active && days.has(S.active.date)) S.active=null;
          rebuildPRs(); save(); closeSheet(); nav('home'); toast('Week reset'); });
      break;
    case 'wipe':
      confirmSheet('Erase everything?','All workouts, food logs, and weigh-ins on this device are deleted. Export a backup first if in doubt.','Erase all data',
        ()=>{ try{localStorage.removeItem(LS_KEY);}catch(e){}
          S=defaults(); ensureWeek(todayS()); save(); applyTheme(); closeSheet(); nav('home'); toast('Fresh start'); });
      break;
  }
});

document.addEventListener('change', function(e){
  const t=e.target;
  if(t.dataset && t.dataset.ch){
    const parts=t.dataset.ch.split('.');
    let v;
    if(t.type==='number'){ v=parseFloat(t.value); if(isNaN(v)||v<0) v=0; }
    else v=String(t.value||'').trim().slice(0,40);
    S[parts[0]][parts[1]]=v; save(); toast('Saved');
    return;
  }
  if(t.dataset && t.dataset.draft && S.active){
    const ex=S.active.exercises[+t.dataset.i]; if(!ex) return;
    ex.draft=ex.draft||{};
    if(t.dataset.draft==='rpe') ex.draft.rpe=t.value;
    else { const v=parseFloat(t.value); ex.draft[t.dataset.draft]=isNaN(v)?0:v; }
    save(); return;
  }
  if(t.id==='importfile' && t.files && t.files[0]){
    const fr=new FileReader();
    fr.onload=()=>doImport(String(fr.result));
    fr.readAsText(t.files[0]); t.value='';
  }
});

const KEYMAP = {forge:{liftA:'upA', lowerA:'lowA', liftB:'upB', lowerB:'lowB'},
                forger:{liftA:'lowA', lowerA:'upA', liftB:'lowB', lowerB:'upB'}};
function migrateKeys(){
  if(S.keysV===2) return;
  const m = KEYMAP[P.id]||{}, mk = k => m[k]||k;
  for(const w of (S.workouts||[])) w.dayKey = mk(w.dayKey);
  if(S.active) S.active.dayKey = mk(S.active.dayKey);
  for(const x of (S.schedule||[])) x.type = mk(x.type);
  const ov = {}; for(const k in (S.overrides||{})) ov[mk(k)] = S.overrides[k]; S.overrides = ov;
  const mon = monOf(todayS());
  if(!S.active && !(S.workouts||[]).some(w=>w.date>=mon)) S.schedule = (S.schedule||[]).filter(x=>x.date<mon);
  S.keysV = 2; save();
}
function bootProfile(id){
  applyProfile(id);
  if(typeof vloadAll==='function') vloadAll().then(()=>{ if(UI.view==='voice'||UI.view==='run'||UI.view==='settings') render(true); });
  S = load();
  if(!S){ S = defaults(); ensureWeek(todayS()); save(); }
  migrateKeys();
  S.profileId = P.id;
  if(!S.settings.coach) S.settings.coach = {on:true, every:'mile', targetPace:0, style:'coach', lines:[]};
  if(!S.settings.coach.lines) S.settings.coach.lines = [];
  ensureWeek(todayS());
  rebuildPRs();
  applyTheme();
}
function switchProfile(id){
  if(S) save();
  bootProfile(id);
  UI.view='home'; UI.exId=null; UI.prevDay=null;
  render();
  toast(P.name+' ready');
}
