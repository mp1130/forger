<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-title" content="FORGER">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FORGER · Strong · Balanced · Built</title>
<style>
/* ============ FORGE — single-file home gym app ============ */
:root{
  --bg:#0d1117;            /* iron */
  --panel:#151b23;         /* plate */
  --panel2:#1c242f;        /* raised plate */
  --line:#28313d;
  --text:#e9eef4;          /* chalk */
  --dim:#8593a5;           /* steel */
  --accent:#ff8a3d;        /* signal orange — primary action + rest timer only */
  --accent-ink:#1c1006;
  --good:#35d07f;          /* logged / done / protein */
  --warn:#f5b849;          /* warm-up / hold */
  --info:#5b9dff;          /* carbs / info */
  --bad:#ff6262;           /* missed / danger */
  --shadow:0 10px 30px -12px rgba(0,0,0,.55);
}
[data-theme="light"]{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f2f5f9; --line:#dbe2ea;
  --text:#141b24; --dim:#5c6a7c; --accent:#f26d17; --accent-ink:#fff7f0;
  --good:#0f9d5f; --warn:#c98a10; --info:#2f6fd6; --bad:#d94040;
  --shadow:0 10px 24px -14px rgba(20,30,45,.25);
}
[data-prof="forger"]{
  --bg:#0d0a0e; --panel:#171219; --panel2:#211a24; --line:#2f2533;
  --text:#fcf6f8; --dim:#b8a7b6; --accent:#ff6b8f; --accent-ink:#ffffff;
  --rose2:#ffa58f; --champ:#e9c9a1; --good:#5fd6a4; --info:#9fb4ff;
  --shadow:0 18px 40px -22px rgba(0,0,0,.8); --fig-hl:#ff8fab;
}
[data-prof="forger"][data-theme="light"]{
  --bg:#fbf6f3; --panel:#ffffff; --panel2:#f7eef0; --line:#eedfe3;
  --text:#251a22; --dim:#8a7883; --accent:#e2507a; --accent-ink:#ffffff;
  --rose2:#f28a72; --champ:#a8794a; --good:#1f9e6c; --fig-hl:#e2507a; --shadow:0 18px 40px -26px rgba(80,30,50,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(86px + env(safe-area-inset-bottom));
  touch-action:manipulation;
}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:280px;pointer-events:none;z-index:0;
  background:radial-gradient(70% 130% at 50% -30%, rgba(255,138,61,.10), transparent 70%);}
[data-theme="light"] body::before{background:radial-gradient(70% 130% at 50% -30%, rgba(242,109,23,.10), transparent 70%)}
body.notab{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
#wrap{max-width:520px;margin:0 auto;padding:14px 14px 0;position:relative;z-index:1}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font-family:inherit}
.num{font-variant-numeric:tabular-nums}

/* --- type system: compressed athletic display, stencil microlabels --- */
.disp{font-weight:800;letter-spacing:-.02em;transform:scaleX(.94);transform-origin:left;display:inline-block}
.h1{font-size:30px;line-height:1.08}
.h2{font-size:21px;line-height:1.15}
.klabel{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);font-weight:800}
.klabel.acc{color:var(--accent)}
.sub{font-size:13.5px;color:var(--dim)}
.fine{font-size:12px;color:var(--dim);line-height:1.45}
.dim{color:var(--dim)}
.good-t{color:var(--good)} .warn-t{color:var(--warn)} .bad-t{color:var(--bad)} .info-t{color:var(--info)} .acc-t{color:var(--accent)}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.05}

/* --- structure --- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.acc{border-color:rgba(255,138,61,.45);background:linear-gradient(180deg,rgba(255,138,61,.10),rgba(255,138,61,.03)),var(--panel)}
.card.goodc{border-color:rgba(53,208,127,.4)}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 2px 14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.divline{height:1px;background:var(--line);margin:13px 0}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mb6{margin-bottom:6px}.mb10{margin-bottom:10px}

/* --- buttons --- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;width:100%;
  border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);
  font-weight:800;font-size:16px;letter-spacing:.01em}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px -8px rgba(255,138,61,.55)}
.btn.goodb{background:var(--good);border-color:var(--good);color:#07130c}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--bad);border-color:rgba(255,98,98,.4)}
.btn.small{min-height:42px;width:auto;font-size:14px;padding:0 14px;border-radius:12px}
.btn.tiny{min-height:34px;width:auto;font-size:12.5px;padding:0 11px;border-radius:10px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;background:var(--panel2);
  border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--text)}
.chip.dimc{color:var(--dim)}
.chip.accc{color:var(--accent);border-color:rgba(255,138,61,.4);background:rgba(255,138,61,.10)}
.chip.goodc{color:var(--good);border-color:rgba(53,208,127,.4);background:rgba(53,208,127,.10)}
.chip.warnc{color:var(--warn);border-color:rgba(245,184,73,.45);background:rgba(245,184,73,.10)}
.chip.infoc{color:var(--info);border-color:rgba(91,157,255,.4);background:rgba(91,157,255,.10)}
button.chip:active{transform:translateY(1px)}
.icnbtn{width:40px;height:40px;min-height:40px;display:grid;place-items:center;border-radius:11px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:15px}
.linky{background:none;border:0;color:var(--dim);font-size:13.5px;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:8px}

/* --- fields --- */
.field{width:100%;min-height:50px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  color:var(--text);padding:12px;font-size:16px}
textarea.field{min-height:88px;line-height:1.45;resize:vertical}
select.field{appearance:none;-webkit-appearance:none;padding-right:32px;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.flabel{display:block;margin:0 0 6px 2px}

/* --- progress bars --- */
.bar{height:10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease;min-width:0}
.bar.goodf>i{background:var(--good)} .bar.infof>i{background:var(--info)} .bar.warnf>i{background:var(--warn)}
.bar.over>i{background:var(--bad)}
.barlabel{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px}
.macline{margin-bottom:11px}
.macline:last-child{margin-bottom:0}

/* --- week strip (the rack) --- */
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wcell{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel2)}
.wcell .wd{font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--dim)}
.wcell .wq{font-size:11.5px;font-weight:800}
.wcell .wdot{font-size:11px;line-height:1;height:12px}
.wcell.st-done{border-color:rgba(53,208,127,.5);background:rgba(53,208,127,.10)}
.wcell.st-done .wdot{color:var(--good)}
.wcell.st-miss{border-color:rgba(255,98,98,.4)}
.wcell.st-miss .wdot,.wcell.st-miss .wq{color:var(--bad)}
.wcell.st-rest .wq{color:var(--dim)}
.wcell.istoday{box-shadow:0 0 0 2px var(--accent)}
.legendrow{display:flex;gap:12px;margin-top:9px;flex-wrap:wrap}
.legendrow span{font-size:11px;color:var(--dim);display:inline-flex;align-items:center;gap:5px}

/* --- lists --- */
.listrow{display:flex;align-items:center;gap:11px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.listrow:last-child{border-bottom:0}
.lr-main{flex:1;min-width:0}
.lr-t{font-size:15px;font-weight:700;line-height:1.25}
.lr-s{font-size:12.5px;color:var(--dim);margin-top:2px}
.lr-chev{color:var(--dim);font-size:16px}
.numchip{width:26px;height:26px;flex:0 0 26px;border-radius:8px;display:grid;place-items:center;
  background:var(--panel2);border:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--dim)}
.emptystate{text-align:center;padding:26px 10px}
.emptystate .big{font-size:22px}

/* --- tab bar --- */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;border-top:1px solid var(--line);
  background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#tabbar .inner{max-width:520px;margin:0 auto;display:flex;padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;
  color:var(--dim);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 2px;border-radius:12px}
#tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#tabbar button.on{color:var(--accent)}
body.notab #tabbar{display:none}

/* --- rest timer dock (signature element) --- */
#restbar{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:60;
  max-width:496px;margin:0 auto;border-radius:15px;overflow:hidden;
  background:linear-gradient(180deg,#2a1608,#20110a);border:1px solid rgba(255,138,61,.55);
  box-shadow:0 14px 34px -10px rgba(255,110,30,.35)}
[data-theme="light"] #restbar{background:linear-gradient(180deg,#fff3e8,#ffe9d6)}
body.notab #restbar{bottom:calc(14px + env(safe-area-inset-bottom))}
#restbar .rb-in{display:flex;align-items:center;gap:10px;padding:10px 12px 12px}
#restbar .rb-time{font-size:26px;font-weight:800;letter-spacing:-.01em;color:var(--accent);min-width:78px}
[data-theme="light"] #restbar .rb-time{color:#c4570a}
#restbar .rb-lab{flex:1;min-width:0}
#restbar .rb-lab .klabel{color:rgba(255,183,128,.9)}
[data-theme="light"] #restbar .rb-lab .klabel{color:#a2540f}
#restbar .rb-lab div:last-child{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#restbar .rb-track{position:absolute;left:0;bottom:0;height:4px;width:100%;background:rgba(255,138,61,.18)}
#restbar .rb-fill{height:100%;background:var(--accent);width:100%}
#restbar.done{animation:pulse .9s ease infinite alternate}
#restbar.done .rb-time{color:var(--good)}
@keyframes pulse{from{box-shadow:0 10px 30px -10px rgba(53,208,127,.25)}to{box-shadow:0 10px 34px -6px rgba(53,208,127,.6)}}

/* --- workout player --- */
.plhead{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;margin:0 -14px 12px;padding:10px 14px;
  background:color-mix(in srgb, var(--bg) 86%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.plhead .plmid{flex:1;min-width:0;text-align:center}
.plhead .plmid .klabel{display:block}
.plhead .plclock{font-size:13px;font-weight:800;color:var(--text)}
.excard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.excard.donex{border-color:rgba(53,208,127,.45)}
.exname{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;text-align:left;width:100%}
.exname .xt{font-size:17px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0}
.exname .xi{color:var(--dim);font-size:15px}
.exmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px}
.badge{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:99px}
.badge.addw{color:var(--good);background:rgba(53,208,127,.13)}
.badge.holdw{color:var(--warn);background:rgba(245,184,73,.14)}
.badge.buildw{color:var(--dim);background:var(--panel2)}
.prevline{font-size:12px;color:var(--dim);margin-top:7px}
.setline{display:flex;gap:10px;align-items:center;width:100%;background:var(--panel2);border:1px solid transparent;
  border-left:3px solid var(--good);border-radius:11px;padding:10px 11px;margin-top:7px;color:var(--text);font-size:15px;text-align:left}
.setline.warmset{border-left-color:var(--warn);opacity:.9}
.sl-n{width:23px;height:23px;flex:0 0 23px;border-radius:7px;background:rgba(53,208,127,.14);color:var(--good);
  font-size:12px;font-weight:800;display:grid;place-items:center}
.setline.warmset .sl-n{background:rgba(245,184,73,.15);color:var(--warn)}
.sl-main{font-weight:800;flex:1}
.sl-rpe{color:var(--dim);font-size:13px;font-weight:700}
.sl-edit{color:var(--dim);font-size:13px}
.editor{margin-top:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px}
.edtop{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rpesel{min-height:34px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);
  font-size:13px;font-weight:700;padding:4px 8px}
.edrow{display:grid;grid-template-columns:1.15fr 1fr;gap:8px;margin:11px 0}
.step{display:grid;grid-template-columns:50px 1fr 50px;height:58px;background:var(--panel);border:1px solid var(--line);
  border-radius:13px;overflow:hidden}
.step>button{background:transparent;border:0;color:var(--accent);font-size:14px;font-weight:800}
.step>button:active{background:rgba(255,138,61,.12)}
.stepmid{display:flex;align-items:center;justify-content:center;gap:4px;border-left:1px solid var(--line);border-right:1px solid var(--line);min-width:0}
.stepmid input{width:100%;max-width:74px;background:transparent;border:0;color:var(--text);font-size:23px;font-weight:800;
  text-align:center;padding:0;font-variant-numeric:tabular-nums}
.stepmid .unit{font-size:11px;font-weight:800;color:var(--dim);letter-spacing:.06em}
.steplab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:800;text-align:center;margin-bottom:4px}
.exfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px}
.warmcard{border-style:dashed}
.warmitems{margin:8px 0 0;padding:0;list-style:none}
.warmitems li{padding:5px 0;font-size:14px;color:var(--text);display:flex;gap:8px;align-items:baseline}
.warmitems li::before{content:"›";color:var(--accent);font-weight:800}

/* --- exercise detail --- */
.exdetail ol{margin:8px 0 2px;padding-left:21px}
.exdetail ol li{margin:8px 0;line-height:1.5}
.exdetail ul{list-style:none;margin:8px 0 2px;padding:0}
.exdetail ul li{margin:7px 0;padding-left:19px;position:relative;line-height:1.5}
.exdetail ul.cuel li::before{content:"▸";position:absolute;left:0;color:var(--good);font-weight:800}
.exdetail ul.badl li::before{content:"✕";position:absolute;left:0;color:var(--bad);font-weight:800;font-size:12px;top:3px}
.exdetail ul.subl li::before{content:"⇄";position:absolute;left:0;color:var(--info);font-weight:800}
.kv{display:grid;grid-template-columns:92px 1fr;gap:10px;margin:10px 0}
.kv .kvk{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:800;padding-top:3px}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}

/* --- food --- */
.quickrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.quickrow:last-child{border-bottom:0}
.qr-main{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.qr-main .lr-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logitem{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.logitem:last-child{border-bottom:0}
.delx{width:36px;height:36px;min-height:36px;border-radius:10px;background:none;border:1px solid var(--line);color:var(--dim);font-size:14px}
.datenav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datenav .dn-mid{flex:1;text-align:center}

/* --- charts & stats --- */
.chartbox{margin-top:10px}
.chartbox svg{width:100%;height:auto;display:block}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px 8px;text-align:center}
.stat .sv{font-size:19px;font-weight:800;letter-spacing:-.01em}
.stat .sk{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:800;margin-top:3px}
.weekdots{display:flex;gap:6px}
.weekdots i{width:12px;height:12px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.weekdots i.on{background:var(--good);border-color:var(--good)}

/* --- segmented --- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel2);border:1px solid var(--line);
  border-radius:13px;padding:3px;gap:3px}
.seg button{border:1px solid transparent;background:transparent;color:var(--dim);min-height:42px;border-radius:10px;font-weight:800;font-size:14px}
.seg button.on{background:var(--panel);color:var(--text);border-color:var(--line)}

/* --- modal / sheet --- */
#modal{position:fixed;inset:0;z-index:80;background:rgba(3,6,10,.66);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-bottom:0;
  border-radius:20px 20px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto;animation:up .22s ease}
.grabber{width:42px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 14px}
@keyframes up{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:90;
  background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:13.5px;font-weight:700;
  padding:11px 16px;border-radius:99px;box-shadow:var(--shadow);max-width:88%;text-align:center}
#toast[hidden]{display:none}
body.notab #toast{bottom:calc(30px + env(safe-area-inset-bottom))}

@media (prefers-reduced-motion:reduce){
  *,#restbar.done{animation:none!important;transition:none!important}
}
@media (min-width:640px){
  #wrap{padding-top:22px}
  .h1{font-size:34px}
}
</style>
</head>
<body>
<div id="wrap"><main id="view"></main></div>

<div id="restbar" hidden>
  <div class="rb-in">
    <div class="rb-time num" id="rb-time">1:30</div>
    <div class="rb-lab"><span class="klabel" id="rb-k">Rest</span><div id="rb-ex"></div></div>
    <button class="btn tiny" data-a="rest-add">+15s</button>

</script>
<script>
'use strict';
/* =================== state =================== */
let S = null;

function defaults(){
  return {
    v:1,
    profileId:P.id, keysV:2,
    profile:Object.assign({}, P.profile),
    settings:Object.assign({theme:'dark', restCompound:120, restIso:90,
              coach:{on:true, every:'mile', targetPace:0, style:'coach', lines:[]}}, P.settings),
    quickMeals: QUICK_DEFAULT.map(m=>Object.assign({},m)),
    overrides:{},              // dayKey -> {slotIndex: exerciseId}
    schedule:[],               // [{date,type}]
    workouts:[],               // [{id,date,dayKey,startedAt,finishedAt,durationMin,volume,notes,exercises:[{exerciseId,sets:[{weight,reps,rpe,warmup}]}]}]
    foods:[],                  // [{date, items:[{name,kcal,p,c,f,qty}], waterL}]
    weights:[],                // [{date, lb}]
    exercisePR:{},             // exerciseId -> {bestWeight,bestReps,lastWeight,lastReps}
    customRecents:[],
    photos:{},                 // exerciseId -> your own form photo (data URL)
    runs:[],                   // [{id,date,startedAt,sec,meters,pts,splits,note,who}]
    crew:[],                   // friends' runs, added by pasting a share code
    runActive:null,            // in-progress run (survives refresh)
    stretches:[],              // [{date,kind,min}]
    runReady:{},               // FORGER run-ready checklist, id -> true
    active:null                // in-progress workout (survives refresh)
  };
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || !d.profile) return null;
    if(d.keysV===undefined) d.keysV = 1;
    const base = defaults();
    for(const k of Object.keys(base)) if(d[k]===undefined) d[k]=base[k];
    return d;
  }catch(e){ return null; }
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

/* =================== dates =================== */
const pad = n => String(n).padStart(2,'0');
function fmtD(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseD(s){ const a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function todayS(){ return fmtD(new Date()); }
function addD(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return fmtD(d); }
function monOf(s){ const d=parseD(s); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); return fmtD(d); }
const WD_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MO_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function niceD(s){ const d=parseD(s); return WD_SHORT[d.getDay()]+', '+MO_SHORT[d.getMonth()]+' '+d.getDate(); }
function shortD(s){ const d=parseD(s); return MO_SHORT[d.getMonth()]+' '+d.getDate(); }
function weekDates(anyDate){ const m=monOf(anyDate); return Array.from({length:7},(_,i)=>addD(m,i)); }

/* =================== schedule =================== */
function ensureWeek(anyDate){
  const m = monOf(anyDate);
  if(S.schedule.some(x=>x.date===m)) return;
  for(let i=0;i<7;i++) S.schedule.push({date:addD(m,i), type:DAY_TYPES[i]});
  S.schedule.sort((a,b)=>a.date<b.date?-1:1);
  save();
}
function typeFor(dateS){
  const hit = S.schedule.find(x=>x.date===dateS);
  if(hit) return hit.type;
  return DAY_TYPES[(parseD(dateS).getDay()+6)%7];
}

/* =================== workouts / PR =================== */
const uid = ()=> 'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function workoutsOn(dateS){ return S.workouts.filter(w=>w.date===dateS); }
function liftWorkoutsInWeek(anyDate){
  const days = new Set(weekDates(anyDate));
  return S.workouts.filter(w=>days.has(w.date) && DAY_META[w.dayKey] && DAY_META[w.dayKey].kind==='lift');
}
function workingSets(ex){ return (ex.sets||[]).filter(s=>!s.warmup && s.reps>0); }
function sessionVolume(w){
  let v=0;
  for(const ex of (w.exercises||[])) for(const s of workingSets(ex)) v += (s.weight||0)*(s.reps||0);
  return Math.round(v);
}
function sessionReps(w){
  let r=0;
  for(const ex of (w.exercises||[])) for(const s of workingSets(ex)) r += (s.reps||0);
  return r;
}
/* one set, written the way that movement is actually loaded */
function setLabel(exId, s){
  const L = loadOf(exId);
  if(L==='time') return s.reps+' s hold';
  if(L==='band') return (s.band||'Band')+' × '+s.reps;
  if(L==='bw')   return (s.weight>0 ? 'BW +'+trimW(s.weight)+' lb' : 'Bodyweight')+' × '+s.reps;
  return trimW(s.weight)+' lb × '+s.reps;
}
function setShort(exId, s){
  const L = loadOf(exId);
  if(L==='time') return s.reps+'s';
  if(L==='band') return (s.band||'Band').slice(0,4)+'×'+s.reps;
  if(L==='bw')   return (s.weight>0 ? '+'+trimW(s.weight) : 'BW')+'×'+s.reps;
  return trimW(s.weight)+'×'+s.reps;
}
/* is set A better than set B for this movement? */
function setBeats(exId, a, b){
  if(loadOf(exId)==='db') return a.weight>b.weight || (a.weight===b.weight && a.reps>b.reps);
  if(loadOf(exId)==='band'){
    const ai=BANDS.indexOf(a.band||''), bi=BANDS.indexOf(b.band||'');
    return ai>bi || (ai===bi && a.reps>b.reps);
  }
  return a.reps>b.reps || (a.reps===b.reps && (a.weight||0)>(b.weight||0));
}
function rebuildPRs(){
  S.exercisePR = {};
  const list = S.workouts.slice().sort((a,b)=>a.date<b.date?-1:(a.date>b.date?1:0));
  for(const w of list){
    for(const ex of (w.exercises||[])){
      const ws = workingSets(ex);
      if(!ws.length) continue;
      const id = ex.exerciseId;
      let best = ws[0];
      for(const s of ws) if(setBeats(id,s,best)) best=s;
      const pr = S.exercisePR[id] || (S.exercisePR[id]={bestWeight:0,bestReps:0,bestBand:'',lastWeight:0,lastReps:0,lastBand:''});
      if(setBeats(id,best,{weight:pr.bestWeight,reps:pr.bestReps,band:pr.bestBand})){
        pr.bestWeight=best.weight||0; pr.bestReps=best.reps; pr.bestBand=best.band||'';
      }
      pr.lastWeight = best.weight||0; pr.lastReps = best.reps; pr.lastBand = best.band||'';
    }
  }
}
function lastSets(exId){
  const list = S.workouts.slice().sort((a,b)=>a.date<b.date?1:-1);
  for(const w of list){
    for(const ex of (w.exercises||[])){
      if(ex.exerciseId===exId){
        const ws = workingSets(ex);
        if(ws.length) return {date:w.date, sets:ws};
      }
    }
  }
  return null;
}
function bestSet(exId){
  const p=S.exercisePR[exId];
  return (p && (p.bestWeight>0 || p.bestReps>0)) ? p : null;
}
function bestLabel(exId){
  const p = bestSet(exId); if(!p) return '';
  return setLabel(exId, {weight:p.bestWeight, reps:p.bestReps, band:p.bestBand});
}
function bestSessionVolume(exId){
  let best=0;
  for(const w of S.workouts){
    for(const ex of (w.exercises||[])){
      if(ex.exerciseId!==exId) continue;
      let v=0; for(const s of workingSets(ex)) v+=(s.weight||0)*(s.reps||0);
      if(v>best) best=v;
    }
  }
  return Math.round(best);
}
function hintFor(exId, lo, hi){
  const last = lastSets(exId);
  if(!last) return null;
  const L = loadOf(exId);
  const topped = last.sets.every(s=>s.reps>=hi);
  const short  = last.sets.some(s=>s.reps<lo);
  if(L==='time'){
    if(topped) return {cls:'addw',  label:'Add 5–10 s'};
    if(short)  return {cls:'holdw', label:'Hold this time'};
    return {cls:'buildw', label:'Build the hold'};
  }
  if(L==='bw'){
    if(topped) return {cls:'addw',  label:'Add reps or slow the tempo'};
    if(short)  return {cls:'holdw', label:'Hold this variation'};
    return {cls:'buildw', label:'Build reps'};
  }
  if(L==='band'){
    if(topped) return {cls:'addw',  label:'Step up the band'};
    if(short)  return {cls:'holdw', label:'Hold this band'};
    return {cls:'buildw', label:'Build reps'};
  }
  if(topped) return {cls:'addw',  label:'+2.5–5 lb today'};
  if(short)  return {cls:'holdw', label:'Hold weight'};
  return {cls:'buildw', label:'Build reps'};
}

/* program slots with swaps applied */
function slotList(dayKey){
  const prog = PROGRAM[dayKey];
  if(!prog) return [];
  const ov = S.overrides[dayKey]||{};
  return prog.slots.map((s,i)=>{
    const id = ov[i] || s.id;
    return {slot:i, id, base:s.id, swapped: !!ov[i], sets:s.sets, lo:s.lo, hi:s.hi, comp:!!s.comp, side:!!s.side};
  });
}

/* =================== today's suggestion =================== */
function suggestion(){
  const t = todayS();
  ensureWeek(t);
  const trainedToday = workoutsOn(t).some(w=>DAY_META[w.dayKey] && DAY_META[w.dayKey].kind==='lift');
  if(trainedToday) return {mode:'trained'};
  const done = new Set(liftWorkoutsInWeek(t).map(w=>w.dayKey));
  const next = LIFT_ORDER.find(k=>!done.has(k));
  const schedT = typeFor(t);
  const schedKind = DAY_META[schedT].kind;
  let schedSoFar=0;
  for(const d of weekDates(t)){ if(d>t) break; if(DAY_META[typeFor(d)].kind==='lift') schedSoFar++; }
  const behind = done.size < schedSoFar;
  if(next && (schedKind==='lift' || behind)){
    return {mode:'lift', key:next, shifted: (schedKind==='lift' && next!==schedT) || (schedKind!=='lift' && behind)};
  }
  if(!next) return {mode:'complete'};
  if(schedKind==='cardio'){
    const rode = workoutsOn(t).some(w=>w.dayKey==='cardio') || S.runs.some(r=>r.date===t);
    return {mode: rode?'cardio-done':'cardio'};
  }
  return {mode:'rest'};
}
function dayStatus(dateS){
  const t = todayS();
  const type = typeFor(dateS);
  const kind = DAY_META[type].kind;
  const has = workoutsOn(dateS).length>0 || (kind!=='lift' && S.runs.some(r=>r.date===dateS));
  if(has) return 'done';
  if(kind==='lift') return dateS<t ? 'miss' : 'todo';
  if(kind==='cardio') return dateS<t ? 'rest' : 'todo';
  return 'rest';
}

/* =================== food =================== */
function foodOf(dateS){ return S.foods.find(f=>f.date===dateS) || {date:dateS, items:[], waterL:0}; }
function foodWrite(dateS){
  let f = S.foods.find(x=>x.date===dateS);
  if(!f){ f={date:dateS, items:[], waterL:0}; S.foods.push(f); }
  if(f.waterL===undefined) f.waterL=0;
  return f;
}
function totalsFor(dateS){
  const f = foodOf(dateS);
  const t = {kcal:0,p:0,c:0,f:0,water:f.waterL||0};
  for(const it of f.items){
    const q = it.qty||1;
    t.kcal+=it.kcal*q; t.p+=it.p*q; t.c+=it.c*q; t.f+=it.f*q;
  }
  t.kcal=Math.round(t.kcal); t.p=Math.round(t.p); t.c=Math.round(t.c); t.f=Math.round(t.f);
  return t;
}
function isLiftDate(dateS){ return DAY_META[typeFor(dateS)].kind==='lift'; }
function targetsFor(dateS){
  const lift = isLiftDate(dateS);
  const bf = !!S.profile.breastfeeding;
  return {
    lift, bf,
    kcal: (lift ? S.profile.calorieLift : S.profile.calorieRest) + (bf? 400:0),
    p: S.profile.proteinG + (bf? 15:0),
    c: (lift ? S.settings.carbLift : S.settings.carbRest) + (bf? 50:0),
    f: S.settings.fatG + (bf? 8:0),
    water: Math.max(S.settings.waterGoalL, bf? 3.5 : 0)
  };
}

/* =================== bodyweight =================== */
function weightUpsert(dateS, lb){
  const hit = S.weights.find(w=>w.date===dateS);
  if(hit) hit.lb=lb; else S.weights.push({date:dateS, lb});
  S.weights.sort((a,b)=>a.date<b.date?-1:1);
  S.profile.weightLb = lb;
}
function lastWeight(){ return S.weights.length ? S.weights[S.weights.length-1] : null; }
function weekAvgWeight(anyDate){
  const days = new Set(weekDates(anyDate));
  const es = S.weights.filter(w=>days.has(w.date));
  if(!es.length) return null;
  return es.reduce((a,b)=>a+b.lb,0)/es.length;
}

/* =================== streak / month =================== */
function streakCount(){
  let c=0, d=todayS();
  const t=todayS();
  for(let i=0;i<220;i++){
    const kind = DAY_META[typeFor(d)].kind;
    if(kind==='lift'){
      const has = S.workouts.some(w=>w.date===d && DAY_META[w.dayKey] && DAY_META[w.dayKey].kind==='lift');
      if(has) c++;
      else if(d<t) break;
    }
    d = addD(d,-1);
  }
  return c;
}
function monthSessions(){
  const now=new Date(); const pre=now.getFullYear()+'-'+pad(now.getMonth()+1);
  return S.workouts.filter(w=>w.date.startsWith(pre) && DAY_META[w.dayKey] && DAY_META[w.dayKey].kind==='lift').length;
}

/* misc format */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = n => Math.round(n).toLocaleString('en-US');
const trimW = w => { const n=Math.round(w*10)/10; return (n%1===0? String(n): n.toFixed(1)); };
function fmtRest(sec){ const m=Math.floor(sec/60), s=sec%60; return m+':'+pad(s); }
function fmtClock(ms){ const s=Math.max(0,Math.floor(ms/1000)); const m=Math.floor(s/60); return m+':'+pad(s%60); }
</script>

  const barRow = (label, val, goal, cls, unit) => {
    const pct = goal? Math.min(100, val/goal*100):0;
    const over = val>goal*1.05;
    return '<div class="macline"><div class="barlabel"><span>'+label+'</span><span class="num dim">'+fmtN(val)+' / '+fmtN(goal)+' '+unit+'</span></div>'+
      '<div class="bar '+cls+(over&&cls===''?' over':'')+'"><i style="width:'+pct+'%"></i></div></div>';
  };
  const pLeft = tg.p - tot.p;
  const pChip = tot.p>=tg.p
    ? '<span class="chip goodc">Protein hit ✓</span>'
    : (pLeft<=25 ? '<span class="chip warnc num">Protein: '+pLeft+' g to go</span>'
                 : '<span class="chip dimc num">Protein: '+pLeft+' g to go</span>');

  const quick = S.quickMeals.map((m,i)=>
    '<div class="quickrow">'+
      '<button class="qr-main" data-a="qk-add" data-i="'+i+'">'+
        '<div class="lr-t">'+esc(m.name)+'</div>'+
        '<div class="lr-s num">'+fmtN(m.kcal)+' kcal · '+m.p+'P / '+m.c+'C / '+m.f+'F</div></button>'+
      '<button class="chip accc" data-a="qk-add" data-i="'+i+'">+ Add</button>'+
      '<button class="icnbtn" data-a="qk-edit" data-i="'+i+'" aria-label="Edit meal">✎</button>'+
    '</div>').join('');

  const wd = (parseD(d).getDay()+6)%7;
  const meals = [['Breakfast', SHARED_BREAKFASTS[BF_ROT[wd]], 'bf'], ['Dinner', SHARED_DINNERS[wd], 'dn']];
  const other = P.id==='forge' ? 'forger' : 'forge';
  const pname = (S.profile.partnerName||P.partner);
  const together = '<div class="card togc"><div class="between"><span class="klabel">Eating together</span><span class="fine">same dish, your portion</span></div>'+
    meals.map(([lab,m,kind])=>{
      const mine = m[P.id], theirs = m[other], nm = lab+' · '+m.name;
      const logged = f.items.some(it=>it.name===nm);
      return '<div class="mealrow"><div class="lr-main"><div class="lr-s">'+lab+'</div><div class="lr-t">'+esc(m.name)+'</div>'+
        '<div class="lr-s">'+esc(m.note)+'</div>'+
        '<div class="lr-s num mt6"><b style="color:var(--text)">You '+fmtN(mine.kcal)+' kcal · '+mine.p+'P</b> &nbsp;·&nbsp; '+esc(pname)+' '+fmtN(theirs.kcal)+' kcal · '+theirs.p+'P</div></div>'+
        (logged ? '<span class="chip goodc">Logged ✓</span>' : '<button class="chip accc" data-a="sm-log" data-k="'+kind+'">+ Log mine</button>')+'</div>';
    }).join('')+
    '<button class="chip dimc mt10" data-a="sm-week">'+(UI.mealsOpen?'Hide':'Show')+' this week&#8217;s dinners</button>'+
    (UI.mealsOpen ? '<div class="mt10">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((dn,i)=>
        '<div class="fine" style="padding:4px 0'+(i===wd?';color:var(--text)':'')+'"><b>'+dn+'</b> · '+esc(SHARED_DINNERS[i].name)+'</div>').join('')+'</div>' : '')+
  '</div>';

  const items = f.items.length ? f.items.map((it,i)=>
    '<div class="logitem"><div class="lr-main"><div class="lr-t">'+esc(it.name)+(it.qty>1?' <span class="dim">×'+it.qty+'</span>':'')+'</div>'+
    '<div class="lr-s num">'+fmtN(it.kcal*(it.qty||1))+' kcal · '+Math.round(it.p*(it.qty||1))+'P / '+Math.round(it.c*(it.qty||1))+'C / '+Math.round(it.f*(it.qty||1))+'F</div></div>'+
    '<button class="delx" data-a="fd-del" data-i="'+i+'" aria-label="Remove item">✕</button></div>').join('')
    : '<div class="emptystate"><div class="disp big">Nothing logged yet</div><div class="sub mt6">Quick-add a meal above — one tap covers the macros.</div></div>';

  const recents = S.customRecents.length
    ? '<div class="chiprow mt10">'+S.customRecents.map((r,i)=>'<button class="chip" data-a="fd-recent" data-i="'+i+'">'+esc(r.name)+' <span class="dim num">'+r.kcal+'</span></button>').join('')+'</div>'
    : '';

  const waterPct = Math.min(100, (f.waterL||0)/tg.water*100);

  return ''+
  '<div class="pagehead"><div><div class="klabel">Fuel</div><div class="disp h1">Food log</div></div>'+
    '<span class="chip '+(tg.lift?'accc':'dimc')+'">'+(tg.lift?'Lift-day targets':'Rest-day targets')+'</span></div>'+
  '<div class="datenav"><button class="icnbtn" data-a="fd-prev">‹</button>'+
    '<div class="dn-mid"><div class="lr-t">'+(isToday?'Today':niceD(d))+'</div><div class="lr-s">'+(isToday?niceD(d):'')+'</div></div>'+
    '<button class="icnbtn" data-a="fd-next" '+(isToday?'disabled style="opacity:.35"':'')+'>›</button></div>'+
  '<div class="card">'+
    barRow('Calories', tot.kcal, tg.kcal, '', 'kcal')+
    barRow('Protein', tot.p, tg.p, 'goodf', 'g')+
    barRow('Carbs', tot.c, tg.c, 'infof', 'g')+
    barRow('Fat', tot.f, tg.f, 'warnf', 'g')+
    '<div class="mt10">'+pChip+'</div>'+
  '</div>'+
  together+
  '<div class="card"><div class="between"><span class="klabel">Water</span><span class="num dim">'+((f.waterL||0).toFixed(2).replace(/\.?0+$/,''))+' / '+tg.water+' L</span></div>'+
    '<div class="bar infof mt10"><i style="width:'+waterPct+'%"></i></div>'+
    '<div class="row mt10"><button class="btn small" data-a="fd-water" data-ml="250">+250 ml</button>'+
    '<button class="btn small" data-a="fd-water" data-ml="500">+500 ml</button>'+
    '<button class="btn small ghost" data-a="fd-water" data-ml="0">Reset</button></div>'+
    '<div class="fine mt6">Target 3–4 L on training days.</div></div>'+
  '<div class="card"><span class="klabel">Quick add — default meals</span>'+quick+
    '<div class="fine mt10">Estimates for the default plan. Tap ✎ to tune a meal to how you actually cook it.</div></div>'+
  '<div class="card"><div class="between"><span class="klabel">Custom food</span>'+
    '<button class="chip" data-a="fd-custtoggle">'+(UI.custOpen?'Hide':'Open')+'</button></div>'+
    (UI.custOpen ?
      '<div class="mt10"><input class="field" id="cf-name" placeholder="Name (e.g. 2 slices pizza)">'+
      '<div class="grid2 mt10"><div><span class="klabel flabel">kcal</span><input class="field num" id="cf-kcal" type="number" inputmode="numeric" placeholder="0"></div>'+
      '<div><span class="klabel flabel">Protein g</span><input class="field num" id="cf-p" type="number" inputmode="numeric" placeholder="0"></div>'+
      '<div><span class="klabel flabel">Carbs g</span><input class="field num" id="cf-c" type="number" inputmode="numeric" placeholder="0"></div>'+
      '<div><span class="klabel flabel">Fat g</span><input class="field num" id="cf-f" type="number" inputmode="numeric" placeholder="0"></div></div>'+
      '<button class="btn goodb mt10" data-a="fd-addcustom">Add to log</button>'+recents+'</div>'
      : recents)+
  '</div>'+
  '<div class="card"><span class="klabel">Logged '+(isToday?'today':shortD(d))+'</span>'+items+'</div>';
}
</script>
<script>
'use strict';
/* =================== PROGRESS =================== */
function weightChartSVG(){
  const t = todayS();
  const from = addD(t,-55);
  const es = S.weights.filter(w=>w.date>=from && w.date<=t);
  if(es.length<2) return '<div class="emptystate"><div class="disp big">Not enough weigh-ins</div><div class="sub mt6">Log 3 mornings a week — the trend line shows up after a couple entries.</div><button class="btn mt14" data-a="wt-open">Log bodyweight</button></div>';
  const W=340,H=150,L=34,R=8,T=12,B=22;
  const lbs = es.map(e=>e.lb);
  let mn=Math.min.apply(null,lbs), mx=Math.max.apply(null,lbs);
  if(mx-mn<3){ const mid=(mx+mn)/2; mn=mid-1.5; mx=mid+1.5; }
  mn=Math.floor(mn-0.5); mx=Math.ceil(mx+0.5);
  const span = 55;
  const X = ds => L + ( (parseD(ds)-parseD(from)) / 86400000 ) / span * (W-L-R);
  const Y = lb => T + (1-(lb-mn)/(mx-mn)) * (H-T-B);
  const dots = es.map(e=>'<circle cx="'+X(e.date).toFixed(1)+'" cy="'+Y(e.lb).toFixed(1)+'" r="2.6" fill="var(--dim)" opacity=".55"/>').join('');
  // weekly averages
  const wk = {};
  for(const e of es){ const m=monOf(e.date); (wk[m]=wk[m]||[]).push(e.lb); }
  const avgPts = Object.keys(wk).sort().map(m=>({x:X(addD(m,3)), y:Y(wk[m].reduce((a,b)=>a+b,0)/wk[m].length)}));
  const line = avgPts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const avgDots = avgPts.map(p=>'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.6" fill="var(--accent)"/>').join('');
  const gy1=Y(mx), gy2=Y(mn);
  return '<div class="chartbox"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bodyweight, last 8 weeks">'+
   '<line x1="'+L+'" y1="'+gy1+'" x2="'+(W-R)+'" y2="'+gy1+'" stroke="var(--line)" stroke-width="1"/>'+
   '<line x1="'+L+'" y1="'+gy2+'" x2="'+(W-R)+'" y2="'+gy2+'" stroke="var(--line)" stroke-width="1"/>'+
   '<text x="'+(L-6)+'" y="'+(gy1+4)+'" text-anchor="end" font-size="10" fill="var(--dim)">'+mx+'</text>'+
   '<text x="'+(L-6)+'" y="'+(gy2+4)+'" text-anchor="end" font-size="10" fill="var(--dim)">'+mn+'</text>'+
   '<text x="'+L+'" y="'+(H-6)+'" font-size="10" fill="var(--dim)">'+shortD(from)+'</text>'+
   '<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="10" fill="var(--dim)">'+shortD(t)+'</text>'+
   dots+
   (avgPts.length>1?'<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>':'')+
   avgDots+
  '</svg><div class="fine">Dots = daily weigh-ins · orange line = weekly average (that&#8217;s the number that matters).</div></div>';
}

function stretchMonthCount(){ const m=todayS().slice(0,7); return (S.stretches||[]).filter(x=>x.date.slice(0,7)===m).length; }
function muscleWeekCard(){
  const h = weeklyMuscleHeat();
  return '<div class="card mmcard"><div class="between"><span class="klabel">Muscles this week</span><span class="fine">last 7 days</span></div>'+
    (h.total ? muscleMapSVG({heat:h.heat})+'<div class="fine mt6" style="text-align:center">Brighter means more working sets. Gaps show what the week missed.</div>'
             : '<div class="fine mt10">Log a workout and the muscles you trained light up here.</div>')+'</div>';
}
function rProgress(){
  const t = todayS();
  const thisAvg = weekAvgWeight(t);
  const lastAvg = weekAvgWeight(addD(t,-7));
  const delta = (thisAvg!=null && lastAvg!=null) ? thisAvg-lastAvg : null;
  const liftWk = liftWorkoutsInWeek(t);
  const doneKeys = new Set(liftWk.map(w=>w.dayKey));
  const dots = LIFT_ORDER.map(k=>'<i class="'+(doneKeys.has(k)?'on':'')+'" title="'+DAY_META[k].name+'"></i>').join('');
  // avg protein this week (days with a log, Mon..today)
  let pSum=0,pDays=0;
  for(const d of weekDates(t)){ if(d>t) break; const f=foodOf(d); if(f.items.length){ pSum+=totalsFor(d).p; pDays++; } }
  const pAvg = pDays? Math.round(pSum/pDays) : null;

  const mains = MAIN_LIFTS.map(id=>{
    const E=EXDB[id], b=bestSet(id), v=bestSessionVolume(id), l=lastSets(id);
    return '<div class="listrow"><div class="lr-main"><div class="lr-t">'+esc(E.n)+'</div>'+
      '<div class="lr-s num">'+(b? 'Best '+trimW(b.bestWeight)+' lb × '+b.bestReps+' · best session '+fmtN(v)+' lb':'No sets logged yet')+
      (l? ' · last '+trimW(l.sets[0].weight)+'×'+l.sets[0].reps:'')+'</div></div></div>';
  }).join('');

  const recents = S.workouts.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,10);
  const recRows = recents.length ? recents.map(w=>{
    const isC = w.dayKey==='cardio';
    const subs = isC ? (w.durationMin||0)+' min easy spin'
      : fmtN(w.volume||sessionVolume(w))+' lb · '+(w.durationMin!=null? w.durationMin+' min':'');
    return '<button class="listrow" data-a="wo-open" data-id="'+w.id+'"><div class="lr-main">'+
      '<div class="lr-t">'+esc(DAY_META[w.dayKey]?DAY_META[w.dayKey].name:w.dayKey)+'</div>'+
      '<div class="lr-s num">'+niceD(w.date)+' · '+subs+'</div></div><span class="lr-chev">›</span></button>';
  }).join('') : '<div class="emptystate"><div class="disp big">No sessions yet</div><div class="sub mt6">Your history lands here after the first workout.</div><button class="btn primary mt14" data-a="nav" data-v="home">Go start one</button></div>';

  return '<div class="pagehead"><div><div class="klabel">Progress</div><div class="disp h1">The Receipts</div></div></div>'+
  muscleWeekCard()+
  '<div class="card"><div class="between"><span class="klabel">Bodyweight</span><button class="chip" data-a="wt-open">+ Log</button></div>'+
    '<div class="row mt10" style="align-items:baseline;gap:14px">'+
      '<div><div class="big num">'+(thisAvg!=null? trimW(thisAvg):'—')+'</div><div class="fine">this week avg (lb)</div></div>'+
      '<div><div class="h2 num" style="font-weight:800;color:'+(delta==null?'var(--dim)':(delta>=0?'var(--good)':'var(--info)'))+'">'+(delta==null?'—':(delta>=0?'+':'')+delta.toFixed(1))+'</div><div class="fine">vs last week</div></div>'+
    '</div>'+weightChartSVG()+'</div>'+
  '<div class="card"><span class="klabel">Weekly review</span>'+
    '<div class="statgrid mt10">'+
      '<div class="stat"><div class="sv num">'+liftWk.length+'/4</div><div class="sk">Sessions</div></div>'+
      '<div class="stat"><div class="sv num">'+(pAvg!=null? pAvg+'g':'—')+'</div><div class="sk">Avg protein</div></div>'+
      '<div class="stat"><div class="sv num">'+(delta==null?'—':(delta>=0?'+':'')+delta.toFixed(1))+'</div><div class="sk">Wt change</div></div>'+
    '</div>'+
    '<div class="row mt10" style="justify-content:space-between"><span class="fine">Lift days this week</span><span class="weekdots">'+dots+'</span></div></div>'+
  '<div class="card"><span class="klabel">Consistency</span>'+
    '<div class="statgrid mt10" style="grid-template-columns:1fr 1fr">'+
      '<div class="stat"><div class="sv num acc-t">'+streakCount()+'</div><div class="sk">Session streak</div></div>'+
      '<div class="stat"><div class="sv num">'+monthSessions()+'</div><div class="sk">This month</div></div>'+
      '<div class="stat"><div class="sv num">'+stretchMonthCount()+'</div><div class="sk">Stretches</div></div>'+
    '</div></div>'+
  '<div class="card"><span class="klabel">Main lifts — best set &amp; volume</span>'+mains+'</div>'+
  '<div class="card"><span class="klabel">Recent workouts</span>'+recRows+'</div>';
}

/* =================== EXERCISE DETAIL =================== */
function rExercise(){
  const id = UI.exId, E = EXDB[id];
  if(!E) return '<div class="card">Unknown exercise.</div>';
  const b = bestSet(id), l = lastSets(id);
  const backLab = UI.exBack==='player'?'‹ Workout': UI.exBack==='preview'?'‹ Day':'‹ Back';
  const sec = (label, inner) => '<div class="card"><span class="klabel">'+label+'</span>'+inner+'</div>';
  const list = (arr, cls) => '<ul class="'+cls+'">'+arr.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  return '<div class="exdetail">'+
  '<div class="row mb10"><button class="btn small ghost" data-a="ex-back">'+backLab+'</button></div>'+
  '<div class="pagehead"><div><div class="klabel">Exercise</div><div class="disp h1">'+esc(E.n)+'</div></div></div>'+
  '<div class="chiprow mb10">'+E.mus.map(m=>'<span class="chip dimc">'+esc(m)+'</span>').join('')+
    '<span class="chip '+(loadOf(id)==='db'?'dimc':'infoc')+'">'+
       (loadOf(id)==='bw'?'Bodyweight':loadOf(id)==='band'?'Band':loadOf(id)==='bike'?'Cardio':loadOf(id)==='time'?'Timed hold':'Dumbbells')+'</span>'+
    (b? '<span class="chip goodc num">Best '+esc(bestLabel(id))+'</span>':'')+
    (l? '<span class="chip dimc num">Last '+esc(setShort(id,l.sets[0]))+'</span>':'')+'</div>'+
  figBlock(id)+
  musclesCard(E.mus||[], 'Muscles worked')+
  sec('Setup &amp; equipment','<div class="mt6">'+esc(E.setup)+'</div>')+
  sec('How to do it','<ol>'+E.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>')+
  sec('What good form looks like', list(E.cues,'cuel'))+
  sec('Common mistakes', list(E.mistakes,'badl'))+
  sec('Breathing','<div class="mt6">'+esc(E.breath)+'</div>')+
  (E.bottom||E.top ? sec('Positions',
    (E.bottom?'<div class="kv"><span class="kvk">Bottom</span><span>'+esc(E.bottom)+'</span></div>':'')+
    (E.top?'<div class="kv"><span class="kvk">Top</span><span>'+esc(E.top)+'</span></div>':'')) : '')+
  sec('Home substitutions', list(E.subs,'subl'))+
  stretchChips(id)+
  '</div>';
}

/* =================== SETTINGS =================== */

  const st=S.settings, pf=S.profile;
  const numRow = (label, path, val, step) =>
    '<div><span class="klabel flabel">'+label+'</span><input class="field num" type="number" inputmode="numeric" step="'+(step||1)+'" value="'+val+'" data-ch="'+path+'"></div>';
  return '<div class="row mb10"><button class="btn small ghost" data-a="nav" data-v="home">&#8249; Home</button></div>'+
  '<div class="pagehead"><div><div class="klabel">Setup</div><div class="disp h1">Settings</div></div><span class="chip dimc">Units: lb</span></div>'+
  '<div class="card acc flat"><div class="between"><span class="klabel acc">Training as</span><span class="disp h2">'+esc(P.name)+'</span></div>'+
    '<div class="fine mt6" style="color:var(--text)">'+esc(P.pitch)+'</div>'+
    '<button class="btn mt10" data-a="who-open">Switch to '+(P.id==='forge'?'FORGER':'FORGE')+'</button>'+
    '<div class="fine mt6">Each program keeps its own workouts, meals, weight and runs on this phone. Nothing is shared between them.</div></div>'+
  (P.id==='forger' ? '<div class="card"><div class="between"><span class="klabel">Breastfeeding</span>'+
    '<button class="chip'+(pf.breastfeeding?' goodc':' dimc')+'" data-a="bf-toggle">'+(pf.breastfeeding?'Yes — targets raised':'No')+'</button></div>'+
    '<div class="fine mt10">While feeding, the app adds about 400 kcal and 15 g protein to every day and bumps water to 3.5 L. Do not run a deficit while breastfeeding — supply and recovery come first.</div></div>' : '')+
  '<div class="card"><div class="between"><span class="klabel">Coach voice</span><span class="chip dimc num">'+CUES.filter(q=>VOICE.urls[q.k]).length+' / '+CUES.length+'</span></div>'+
    '<div class="fine mt10">Real recorded voices only. Record the lines yourself or have someone record them for you.</div>'+
    '<button class="btn mt10" data-a="nav" data-v="voice">Record coach lines</button></div>'+
  '<div class="card"><span class="klabel">Training partner</span>'+
    '<input class="field mt10" placeholder="'+esc(P.partner)+'" maxlength="24" value="'+esc(pf.partnerName||'')+'" data-ch="profile.partnerName">'+
    '<div class="fine mt10">Shown on the Training together and Eating together cards.</div></div>'+
  '<div class="card"><span class="klabel">Your name on shared runs</span>'+
    '<input class="field mt10" placeholder="e.g. Mike" maxlength="24" value="'+esc(pf.runnerName||'')+'" data-ch="profile.runnerName">'+
    '<div class="fine mt10">Only used inside the share codes you hand out. Nothing is sent anywhere.</div></div>'+
  '<div class="card"><span class="klabel">Daily targets</span>'+
    '<div class="grid2 mt10">'+
      numRow('Lift-day kcal','profile.calorieLift',pf.calorieLift,50)+
      numRow('Rest-day kcal','profile.calorieRest',pf.calorieRest,50)+
      numRow('Protein g','profile.proteinG',pf.proteinG,5)+
      numRow('Fat g','settings.fatG',st.fatG,5)+
      numRow('Lift-day carbs g','settings.carbLift',st.carbLift,10)+
      numRow('Rest-day carbs g','settings.carbRest',st.carbRest,10)+
      numRow('Water goal L','settings.waterGoalL',st.waterGoalL,0.5)+
    '</div><div class="fine mt10">'+P.targetsNote+'</div></div>'+
  '<div class="card"><span class="klabel">Rest timer</span>'+
    '<div class="grid2 mt10">'+
      numRow('Compounds (sec)','settings.restCompound',st.restCompound,15)+
      numRow('Isolation (sec)','settings.restIso',st.restIso,15)+
    '</div><div class="fine mt10">Starts automatically each time a set is logged. +15s and Skip live on the timer itself.</div></div>'+
  '<div class="card"><span class="klabel">Theme</span>'+
    '<div class="seg mt10"><button class="'+(st.theme==='dark'?'on':'')+'" data-a="theme" data-t="dark">Dark</button>'+
    '<button class="'+(st.theme==='light'?'on':'')+'" data-a="theme" data-t="light">Light</button></div></div>'+
  '<div class="card"><span class="klabel">Backup</span>'+
    '<div class="grid2 mt10"><button class="btn" data-a="exp-dl">Download JSON</button><button class="btn" data-a="exp-show">Show JSON</button>'+
    '<button class="btn" data-a="imp-file">Import file</button><button class="btn" data-a="imp-paste">Paste JSON</button></div>'+
    '<div class="fine mt10">Everything lives in this browser&#8217;s storage — export before clearing site data or switching phones.</div></div>'+
  '<div class="card"><span class="klabel">Danger zone</span>'+
    '<button class="btn danger mt10" data-a="wk-reset">Reset current week</button>'+
    '<button class="btn danger mt10" data-a="wipe">Erase all data</button></div>'+
  '<div class="fine" style="text-align:center;margin:6px 0 18px">'+esc(P.name)+' · single file · works offline · your data never leaves this device.<br>Best on iPhone: put this file on any web host (GitHub Pages works), open the link in Safari, then Share → Add to Home Screen.<br>Opening the file straight out of the Files app can hand it to another app instead of Safari.</div>';
}

/* =================== modal / sheet system =================== */
let confirmFn = null;
function openSheet(html){ $('#sheet').innerHTML='<div class="grabber"></div>'+html; $('#modal').hidden=false; }
function closeSheet(){ $('#modal').hidden=true; confirmFn=null; }
function confirmSheet(title, body, label, fn){
  confirmFn = fn;
  openSheet('<div class="disp h2">'+title+'</div><div class="sub mt6">'+body+'</div>'+
    '<button class="btn danger mt14" data-a="confirm-yes">'+label+'</button>'+
    '<button class="btn ghost mt10" data-a="sheet-close">Cancel</button>');
}
let toastT=null;
function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true;},2200);
}

function sheetWorkout(id){
  const w=S.workouts.find(x=>x.id===id); if(!w) return;
  const isC = w.dayKey==='cardio';
  const body = isC
    ? '<div class="sub mt6 num">'+(w.durationMin||0)+' min easy spin'+(w.notes?' · '+esc(w.notes):'')+'</div>'
    : (w.exercises||[]).map(ex=>{
        const E=EXDB[ex.exerciseId];
        const line=(ex.sets||[]).map(s=>(s.warmup?'w':'')+setShort(ex.exerciseId,s)+(s.rpe?('@'+s.rpe):'')).join(', ');
        return '<div class="listrow"><div class="lr-main"><div class="lr-t">'+esc(E?E.n:ex.exerciseId)+'</div><div class="lr-s num">'+ (line||'—') +'</div></div></div>';
      }).join('') + (w.notes? '<div class="fine mt10">Notes: '+esc(w.notes)+'</div>':'');
  openSheet('<div class="disp h2">'+esc(DAY_META[w.dayKey]?DAY_META[w.dayKey].name:w.dayKey)+'</div>'+
   '<div class="sub mt6 num">'+niceD(w.date)+(isC?'':' · '+fmtN(w.volume||sessionVolume(w))+' lb total'+(w.durationMin!=null?' · '+w.durationMin+' min':''))+'</div>'+
   '<div class="mt10">'+body+'</div>'+
   '<button class="btn danger mt14" data-a="wo-del" data-id="'+w.id+'">Delete workout</button>'+
   '<button class="btn ghost mt10" data-a="sheet-close">Close</button>');
}
function sheetSwap(dayKey, slot){
  const cur = slotList(dayKey)[slot];
  const base = PROGRAM[dayKey].slots[slot];
  const grp = EXDB[base.id].grp;
  const mkRow = id => {
    const E=EXDB[id];
    const isCur = id===cur.id;
    return '<button class="listrow" data-a="swap-pick" data-k="'+dayKey+'" data-slot="'+slot+'" data-id="'+id+'">'+
      '<div class="lr-main"><div class="lr-t">'+esc(E.n)+(isCur?' <span class="chip goodc" style="padding:2px 8px;font-size:10.5px">current</span>':'')+
      (id===base.id&&!isCur?' <span class="chip dimc" style="padding:2px 8px;font-size:10.5px">program</span>':'')+'</div>'+
      '<div class="lr-s">'+E.mus.map(esc).join(' · ')+'</div></div>'+(isCur?'':'<span class="lr-chev">›</span>')+'</button>';
  };
  const approved = SWGROUPS[grp].filter(id=>id!==base.id);
  const others = Object.keys(SWGROUPS).filter(g=>g!==grp).map(g=>SWGROUPS[g]).flat();
  openSheet('<div class="disp h2">Swap · '+esc(EXDB[base.id].n)+'</div>'+
   '<div class="sub mt6">History always stays with each exercise — swap freely.</div>'+
   '<div class="klabel mt14">Approved swaps · same muscle group</div>'+mkRow(base.id)+approved.map(mkRow).join('')+
   '<div class="klabel mt14">Other exercises</div>'+others.map(mkRow).join('')+
   '<div style="height:8px"></div>');
}

   '<textarea class="field mt10" id="imp-ta" style="min-height:180px" placeholder="Paste the exported JSON here"></textarea>'+
   '<button class="btn primary mt14" data-a="imp-paste-go">Import</button>');

function doImport(text){
  try{
    const d = JSON.parse(text);
    if(!d || !d.profile || !Array.isArray(d.workouts)) throw new Error('bad');
    const base = defaults();
    for(const k of Object.keys(base)) if(d[k]===undefined) d[k]=base[k];
    S = d; rebuildPRs(); save();
    applyTheme(); closeSheet(); nav('home'); toast('Backup imported ✓');
  }catch(e){ toast('That JSON did not parse — check the paste.'); }
}
function applyTheme(){ document.documentElement.dataset.theme = S.settings.theme==='light'?'light':'dark'; document.documentElement.dataset.prof = P.id; }

<script>
/* =================== EXERCISE FIGURES ===================
   Built from joint angles with fixed bone lengths, so limbs never stretch.
   Side views always face RIGHT. Motion is real joint rotation between a
   start and end pose, with planted feet and hands held in place by
   two-bone inverse kinematics. */

const BN = {torso:30, neck:11, uarm:17, farm:15, thigh:25, shin:24, foot:8, sh:3, hr:6.8, w:11, pw:6};
const D2R = Math.PI/180;
const pol = (p,len,deg) => [p[0]+len*Math.cos(deg*D2R), p[1]+len*Math.sin(deg*D2R)];
const pdist = (p,q) => Math.hypot(p[0]-q[0], p[1]-q[1]);
const pang = (p,q) => Math.atan2(q[1]-p[1], q[0]-p[0])/D2R;
const mirA = a => a ? [180-a[0], 180-a[1], a[2], a[3]] : a;
const mirL = l => l ? [180-l[0], 180-l[1], 180-l[2], l[3], l[4]] : l;
const JOINTS = ['hip','md','nk','hd','sA','sB','eA','hA','eB','hB','pA','pB','kA','aA','tA','kB','aB','tB'];

/* ---------- build a pose from angles ----------
   t torso angle (hip→neck, -90 = upright), c spine curve (+ rounds forward),
   h head angle, a/b arm [upper, fore, sU, sF], l/r leg [thigh, shin, foot, sT, sS].
   ax/ay plants the near ankle at a point instead of giving the hip. */
function pose(o){
  const fr = !!o.front, t = o.t==null ? -90 : o.t, c = o.c||0;
  const a = o.a || (fr ? [84,88] : [93,90]);
  const b = o.b || (fr ? mirA(a) : a);
  const l = o.l || (fr ? [92,90,72] : [90,90,6]);
  const r = o.r || (fr ? mirL(l) : l);
  const pw = fr ? (o.pw==null ? BN.pw : o.pw) : 0, w = fr ? (o.w==null ? BN.w : o.w) : 0;
  let hip;
  if(o.ax!=null){
    const pOff = fr ? pol([0,0], pw, t+90) : [0,0];
    const k = pol([o.ax,o.ay], BN.shin*(l[4]||1), l[1]+180);
    const p = pol(k, BN.thigh*(l[3]||1), l[0]+180);
    hip = [p[0]-pOff[0], p[1]-pOff[1]];
  } else hip = [o.x==null?58:o.x, o.y==null?56.5:o.y];
  const lo = t - c/2, up = t + c/2;
  const md = pol(hip, BN.torso*(o.ts||1)/2, lo);
  const nk = pol(md, BN.torso*(o.ts||1)/2, up);
  const hd = pol(nk, BN.neck*(o.hs==null?1:o.hs), o.h==null ? up : o.h); hd.push(BN.hr);
  let sA, sB, pA, pB;
  if(fr){
    sA = pol(pol(nk, 2, up+180), w, up+90);  sB = pol(pol(nk, 2, up+180), w, up-90);
    pA = pol(hip, pw, t+90);  pB = pol(hip, pw, t-90);
  } else {
    sA = pol(nk, BN.sh, up+180); sB = [sA[0]-1.2, sA[1]+0.6];
    pA = hip.slice(); pB = [hip[0]-1.2, hip[1]+0.5];
  }
  const eA = pol(sA, BN.uarm*(a[2]||1), a[0]), hA = pol(eA, BN.farm*(a[3]||1), a[1]);
  const eB = pol(sB, BN.uarm*(b[2]||1), b[0]), hB = pol(eB, BN.farm*(b[3]||1), b[1]);
  const fl = fr ? 4 : BN.foot;
  const kA = pol(pA, BN.thigh*(l[3]||1), l[0]), aA = pol(kA, BN.shin*(l[4]||1), l[1]), tA = pol(aA, fl, l[2]);
  const kB = pol(pB, BN.thigh*(r[3]||1), r[0]), aB = pol(kB, BN.shin*(r[4]||1), r[1]), tB = pol(aB, fl, r[2]);
  const P = {hip, md, nk, hd, sA, sB, eA, hA, eB, hB, pA, pB, kA, aA, tA, kB, aB, tB};
  if(fr) P.front = 1;
  if(o.top) P.top = 1;
  return o.ground===false ? P : ground(P);
}
/* drop the pose until its lowest point rests on the floor */
const FLOOR_LV = {aA:106.5,aB:106.5,tA:106.5,tB:106.5,kA:105.5,kB:105.5,hA:106,hB:106,eA:105,eB:105,
                  hip:104,md:104,nk:104,pA:104,pB:104,sA:104,sB:104};
function ground(P){
  let dy = Infinity;
  for(const k in FLOOR_LV) if(P[k]) dy = Math.min(dy, FLOOR_LV[k]-P[k][1]);
  if(P.hd) dy = Math.min(dy, 103-P.hd[1]);
  return shiftP(P, 0, dy);
}
function shiftP(P, dx, dy){
  const Q = {}; for(const k in P){ const v=P[k]; Q[k] = Array.isArray(v) ? (k==='hd' ? [v[0]+dx, v[1]+dy, v[2]] : [v[0]+dx, v[1]+dy]) : v; }
  return Q;
}
/* two-bone IK: from base, reach target with bones L1, L2; side picks the bend */
function ik2(base, target, L1, L2, side){
  let d = pdist(base, target);
  d = Math.max(Math.abs(L1-L2)+1e-3, Math.min(L1+L2-1e-3, d));
  const c = (L1*L1 + d*d - L2*L2)/(2*L1*d);
  const a = Math.acos(Math.max(-1, Math.min(1, c)))/D2R;
  return pol(base, L1, pang(base, target) + side*a);
}
/* put a hand or foot exactly on a point (for authoring) */
function reach(P, limb, target, side, endDeg){
  const Q = Object.assign({}, P);
  if(limb==='hA'||limb==='hB'){
    const s = Q['s'+limb[1]], e = ik2(s, target, BN.uarm, BN.farm, side);
    Q['e'+limb[1]] = e; Q[limb] = target.slice();
  } else {
    const L = limb[1], p = Q['p'+L], k = ik2(p, target, BN.thigh, BN.shin, side);
    Q['k'+L] = k; Q['a'+L] = target.slice();
    Q['t'+L] = pol(target, Q.front ? 4 : BN.foot, endDeg==null ? 6 : endDeg);
  }
  return Q;
}

/* ---------- motion: rotate every bone from A to B ---------- */
const SKEL = [['hip','md'],['md','nk'],['nk','hd'],['nk','sA'],['nk','sB'],['sA','eA'],['eA','hA'],['sB','eB'],['eB','hB'],
              ['hip','pA'],['pA','kA'],['kA','aA'],['aA','tA'],['hip','pB'],['pB','kB'],['kB','aB'],['aB','tB']];
const ADJ = {}; for(const [p,q] of SKEL){ (ADJ[p]=ADJ[p]||[]).push(q); (ADJ[q]=ADJ[q]||[]).push(p); }
const _orderCache = {};
function skelOrder(root){
  if(_orderCache[root]) return _orderCache[root];
  const seen = {[root]:1}, order = [], par = {}, q = [root];
  while(q.length){ const j = q.shift(); for(const k of (ADJ[j]||[])) if(!seen[k]){ seen[k]=1; par[k]=j; order.push([j,k]); q.push(k); } }
  return (_orderCache[root] = {order, par});
}
function pickRoot(A, B, cfg){
  if(cfg && cfg.root) return cfg.root;
  for(const j of ['tA','aA','tB','aB','hA','hB','nk','hip']) if(pdist(A[j],B[j]) < 0.8) return j;
  return 'hip';
}
function lerpAng(a, b, t){ let d = ((b-a+540)%360)-180; return a + d*t; }
const nrmA = a => ((a%360)+540)%360-180;
/* every bone turns relative to the bone it hangs from, so a head can only nod
   and a foot can only point and flex — no more swinging round the wrong way */
function tweenPose(A, B, t, cfg){
  if(t<=0) return A; if(t>=1) return B;
  const root = pickRoot(A, B, cfg), {order, par} = skelOrder(root);
  const P = {front:A.front, top:A.top};
  P[root] = [A[root][0]+(B[root][0]-A[root][0])*t, A[root][1]+(B[root][1]-A[root][1])*t];
  const angA = {}, angB = {}, rel = {}, len = {};
  const baseNow = j => par[j]!=null ? pang(P[par[j]], P[j]) : 0;
  for(const [p,c] of order){
    const ta = pang(A[p],A[c]), tb = pang(B[p],B[c]); angA[c]=ta; angB[c]=tb;
    const ra = nrmA(ta - (par[p]!=null ? angA[p] : 0)), rb = nrmA(tb - (par[p]!=null ? angB[p] : 0));
    const la = pdist(A[p],A[c]), lb = pdist(B[p],B[c]);
    if(A.front && Math.abs(nrmA(rb-ra)) > 160){
      const va = pol([0,0], la, ra), vb = pol([0,0], lb, rb), v = [va[0]+(vb[0]-va[0])*t, va[1]+(vb[1]-va[1])*t];
      len[c] = Math.hypot(v[0],v[1]); rel[c] = Math.atan2(v[1],v[0])/D2R;
    } else { len[c] = la+(lb-la)*t; rel[c] = ra + nrmA(rb-ra)*t; }
    P[c] = pol(P[p], len[c], baseNow(p) + rel[c]);
  }
  const kids = {}; for(const [p,c] of order) (kids[p]=kids[p]||[]).push(c);
  const refk = (j, skip) => { for(const c of (kids[j]||[])) if(c!==skip){ P[c] = pol(P[j], len[c], baseNow(j) + rel[c]); refk(c); } };
  const pinned = j => pdist(A[j], B[j]) < 0.8;
  for(const [p,c] of order){
    if(c===root || !pinned(c) || pinned(p) || !par[p]) continue;
    if(c==='md'||c==='sA'||c==='sB'||c==='pA'||c==='pB'||p==='sA'||p==='sB'||p==='pA'||p==='pB') continue;
    const g = par[p], L1 = len[p], L2 = len[c];
    const sinOf = X => { const v1=[X[c][0]-X[g][0], X[c][1]-X[g][1]], v2=[X[p][0]-X[g][0], X[p][1]-X[g][1]];
      return (v1[0]*v2[1]-v1[1]*v2[0])/((Math.hypot(v1[0],v1[1])*Math.hypot(v2[0],v2[1]))||1); };
    const sa = sinOf(A), sb = sinOf(B);
    let side;
    if(Math.abs(sa) > 0.06) side = Math.sign(sa);
    else if(Math.abs(sb) > 0.06) side = Math.sign(sb);
    else if(!A.front && (c[0]==='h' || c[0]==='a')){
      /* straight at both ends: bend the way a real elbow or knee bends */
      const m1 = ik2(P[g], A[c], L1, L2, 1), m2 = ik2(P[g], A[c], L1, L2, -1);
      const r = m => nrmA(pang(m, A[c]) - pang(P[g], m));
      side = c[0]==='h' ? (r(m1) <= r(m2) ? 1 : -1) : (r(m1) >= r(m2) ? 1 : -1);
    } else side = 1;
    P[p] = ik2(P[g], A[c], L1, L2, side);
    P[c] = pol(P[p], L2, pang(P[p], A[c]));
    refk(p, c); refk(c);
  }
  P.hd = [P.hd[0], P.hd[1], A.hd[2]+(B.hd[2]-A.hd[2])*t];
  return P;
}
/* stationary bike: real crank rotation, legs solved to the pedals */
function bikePose(theta){
  const C = [60,88], R = 9, hip = [44,54];
  const P = pose({x:hip[0], y:hip[1], t:-58, h:-50, a:[22,14], b:[20,12], l:[30,110,8], ground:false});
  const ped = (th) => pol(C, R, th);
  for(const [L, th] of [['A',theta],['B',theta+180]]){
    const pd = ped(th), ankle = [pd[0]-2, pd[1]-2.5];
    const p = P['p'+L], c1 = ik2(p, ankle, BN.thigh, BN.shin, 1), c2 = ik2(p, ankle, BN.thigh, BN.shin, -1);
    P['k'+L] = c1[0] > c2[0] ? c1 : c2;
    P['a'+L] = ankle; P['t'+L] = pol(ankle, BN.foot, 12);
  }
  P._crank = [C, ped(theta), ped(theta+180)];
  return P;
}

/* ---------- draw ---------- */
const FW = {torso:11.5, neck:5, uarm:6.6, farm:5.4, thigh:8.6, shin:6.8, foot:4.8};
function _seg(p, q, w, cls){
  return '<line x1="'+p[0].toFixed(1)+'" y1="'+p[1].toFixed(1)+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" stroke-width="'+w+'" class="'+cls+'"/>';
}
function _limb(P, j1, j2, j3, w1, w2, cls, halo){
  let s = '';
  if(halo) s += _seg(P[j1],P[j2],w1+2.6,'fhalo')+_seg(P[j2],P[j3],w2+2.6,'fhalo');
  return s + _seg(P[j1],P[j2],w1,cls) + _seg(P[j2],P[j3],w2,cls);
}
function _spine(P, w, cls){
  const c = [2*P.md[0]-(P.hip[0]+P.nk[0])/2, 2*P.md[1]-(P.hip[1]+P.nk[1])/2];
  return '<path d="M'+P.hip[0].toFixed(1)+' '+P.hip[1].toFixed(1)+' Q'+c[0].toFixed(1)+' '+c[1].toFixed(1)+' '+P.nk[0].toFixed(1)+' '+P.nk[1].toFixed(1)+
    '" stroke-width="'+w+'" class="'+cls+'" fill="none"/>';
}
/* green overlays for the muscles a move works or stretches */
function _hl(P, list){

    const n = side==='f' ? [uy,-ux] : side==='b' ? [-uy,ux] : [0,0], k = amt==null?2.2:amt;
    const a=[p[0]+n[0]*k+ux*2, p[1]+n[1]*k+uy*2], b=[q[0]+n[0]*k-ux*2, q[1]+n[1]*k-uy*2];
    return _seg(a,b,w,'fhl'); };
  const tfront = () => { const d=pdist(P.hip,P.nk)||1, ux=(P.nk[0]-P.hip[0])/d, uy=(P.nk[1]-P.hip[1])/d; return [-uy, ux]; };
  for(const h of list){
    const L = h.slice(-1), B = h.slice(0,-1);
    if(h==='glutes'||h==='glute'){ if(!P.front){ const n=tfront(); s+='<ellipse cx="'+(P.hip[0]-n[0]*3.6).toFixed(1)+'" cy="'+(P.hip[1]-n[1]*3.6).toFixed(1)+'" rx="6.2" ry="6.2" class="fhlf"/>'; } else { s+='<ellipse cx="'+P.pA[0].toFixed(1)+'" cy="'+(P.pA[1]+1).toFixed(1)+'" rx="5" ry="4.5" class="fhlf"/><ellipse cx="'+P.pB[0].toFixed(1)+'" cy="'+(P.pB[1]+1).toFixed(1)+'" rx="5" ry="4.5" class="fhlf"/>'; } }
    else if(h==='abs'){ const n=P.front?[0,0]:tfront(); s+=_seg([P.hip[0]+n[0]*3.5,P.hip[1]+n[1]*3.5-(P.front?3:0)],[P.md[0]+n[0]*3.5,P.md[1]+n[1]*3.5],P.front?6:4.5,'fhl'); }
    else if(h==='obliques'){ s+=_seg(P.pA,[P.sA[0]-2,P.sA[1]+6],4,'fhl'); }
    else if(h==='obliquesB'){ s+=_seg(P.pB,[P.sB[0]+2,P.sB[1]+6],4,'fhl'); }
    else if(h==='chest'){ const n=P.front?[0,0]:tfront(); s+=P.front ? _seg([P.sA[0]-3,P.sA[1]+3],[P.sB[0]+3,P.sB[1]+3],5,'fhl') : _seg([P.md[0]+n[0]*3.5,P.md[1]+n[1]*3.5],[P.nk[0]+n[0]*3.5,P.nk[1]+n[1]*3.5],4.5,'fhl'); }
    else if(h==='back'||h==='lats'){ const n=tfront(); s+=_seg([P.md[0]-n[0]*3.8,P.md[1]-n[1]*3.8],[P.nk[0]-n[0]*3.8,P.nk[1]-n[1]*3.8],4.6,'fhl'); }
    else if(h==='lowback'){ const n=tfront(); s+=_seg([P.hip[0]-n[0]*3.8,P.hip[1]-n[1]*3.8],[P.md[0]-n[0]*3.8,P.md[1]-n[1]*3.8],4.6,'fhl'); }
    else if(h==='neck'){ s+=_seg(P.nk,[P.hd[0]*.55+P.nk[0]*.45,P.hd[1]*.55+P.nk[1]*.45],5,'fhl'); }
    else if(B==='sh'){ const p=P['s'+L]; s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.6" class="fhlf"/>'; }
    else if(B==='tri') s+=off(P['s'+L],P['e'+L],P.front?'m':'b',3.6,1.6);
    else if(B==='bi')  s+=off(P['s'+L],P['e'+L],P.front?'m':'f',3.6,1.6);
    else if(B==='fore') s+=off(P['e'+L],P['h'+L],'m',3.4,0);
    else if(B==='quad') s+=off(P['p'+L],P['k'+L],P.front?'m':'f',4.4,P.front?0:2.2);
    else if(B==='ham')  s+=off(P['p'+L],P['k'+L],'b',4.4,2.2);
    else if(B==='inner') s+=off(P['p'+L],P['k'+L],L==='A'?'b':'f',3.6,2);

function _dumbbell(P, spec){

    vert = spec.indexOf('midv:')===0;

         '<circle cx="'+x1.toFixed(1)+'" cy="'+y1.toFixed(1)+'" r="2.8" fill="var(--fig-eq)"/>'+

/* pick a camera angle */
function viewCfg(id, v){
  if(typeof STRETCHDB!=='undefined' && STRETCHDB[id] && STRETCHDB[id].fig) id = STRETCHDB[id].fig;
  const base = EXFIG[id] || (typeof STFIG!=='undefined' && STFIG[id]);
  if(!base) return null;
  if(v==='v2' && EXFIG2[id]) return EXFIG2[id];
  return base;
}
function viewLabel(id, v){
  const c = viewCfg(id, v);
  return (c && c.label) || (v==='v2' ? 'Other angle' : 'Side');
}
function hasTwoViews(id){ return !!EXFIG2[id]; }

/* ---------- SVG output + animation loop ---------- */
function figSVG(exId, opts){
  const o = opts||{};
  const cfg = viewCfg(exId, o.view); if(!cfg) return '';
  const still = o.mode==='still';
  const t = still ? (o.end ? 1 : 0) : 1;
  const P = figPoseAt(cfg, t, cfg.anim==='bike' ? 0.1 : undefined);
  let g = ''; for(const name of (cfg.gear||[])) g += _gear(name);
  return '<svg class="figsvg '+(still?'figstill':'figanim')+(o.extra?' '+o.extra:'')+'" viewBox="0 -9 132 123" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"'+
    ' data-fig="'+exId+'" data-view="'+(o.view||'')+'">'+g+'<g class="figbody">'+figBody(P, cfg)+'</g></svg>';
}
const FIGRT = {raf:0, t0:0, last:0};
function figTick(now){
  FIGRT.raf = 0;
  const els = document.querySelectorAll('svg.figanim');
  if(!els.length) return;
  if(!FIGRT.t0) FIGRT.t0 = now;
  if(!document.hidden && now - FIGRT.last > 33){
    FIGRT.last = now;
    els.forEach(el => {
      const cfg = viewCfg(el.dataset.fig, el.dataset.view); if(!cfg) return;
      const per = FIG_T[cfg.anim||'rep'] || 3.6, u = (((now-FIGRT.t0)/1000)/per) % 1;
      const g = el.querySelector('.figbody'); if(g) g.innerHTML = figBody(figPoseAt(cfg, figT(cfg,u), u), cfg);
    });
  }
  FIGRT.raf = requestAnimationFrame(figTick);
}
function kickFigs(){
  if(FIGRT.raf || typeof requestAnimationFrame==='undefined') return;
  try{ if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
  FIGRT.raf = requestAnimationFrame(figTick);
}
function figCard(exId){
  const v = UI.figView, cfg = viewCfg(exId, v); if(!cfg) return '';
  if(UI.figMode==='both'){
    return '<div class="figpair">'+
      '<div class="figwrap"><span class="klabel figcap">Start</span>'+figSVG(exId,{mode:'still',view:v})+'</div>'+
      '<div class="figwrap"><span class="klabel figcap">End</span>'+figSVG(exId,{mode:'still',end:1,view:v})+'</div>'+
    '</div>';
  }
  return '<div class="figwrap"><span class="klabel figcap">'+esc(viewLabel(exId,v))+'</span>'+figSVG(exId,{view:v})+'</div>';
}
function figThumb(exId){
  return viewCfg(exId) ? figSVG(exId,{mode:'still',end:1,extra:'exthumb'}) : '';
}

/* =================== MUSCLE MAP ===================
   Front and back body diagrams. Primary muscles light up full, secondary
   ones half. The same regions drive the weekly heat map on Progress. */
const MM_REG = (()=>{
  const e = (cx,cy,rx,ry) => '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'"/>';
  const pair = (dx,cy,rx,ry,c) => e(c-dx,cy,rx,ry)+e(c+dx,cy,rx,ry);
  const F = 60, K = 180;
  return {
    deltF:  pair(25,46,8,8,F),   chest: pair(10,54,11,8,F),  bicep: pair(29,67,5,12,F),
    forearm:pair(33,110,4.5,15,F)+pair(33,110,4.5,15,K),
    abs:    '<rect x="'+(F-8)+'" y="64" width="16" height="36" rx="4"/>',
    oblique:pair(16,84,4.5,13,F), hipflex:pair(9,120,6,5,F), quad:pair(13,148,7.5,20,F),
    adductor:pair(5,140,3,12,F),  shin:pair(13,194,4,15,F),
    trap:   '<path d="M'+K+' 30 L'+(K+18)+' 44 L'+K+' 62 L'+(K-18)+' 44 Z"/>',
    deltR:  pair(25,46,8,8,K),   lat: pair(13,72,9,16,K),    tricep: pair(29,67,5,12,K),
    lowback:'<rect x="'+(K-9)+'" y="86" width="18" height="16" rx="5"/>',
    glute:  pair(10,116,10,10,K), ham: pair(13,150,7,20,K),  calf: pair(13,190,5.5,14,K)
  };
})();
const MM_MAP = [
  [/front shoulder|front delt/i,['deltF']], [/rear delt/i,['deltR']], [/shoulder blade/i,['trap']], [/shoulder|delt/i,['deltF','deltR']],
  [/chest/i,['chest']], [/tricep/i,['tricep']], [/bicep/i,['bicep']], [/forearm/i,['forearm']],
  [/lat/i,['lat']], [/upper back/i,['trap','lat']], [/lower back|spine/i,['lowback']], [/\bback\b/i,['lat','trap']], [/trap|neck/i,['trap']],
  [/oblique|side of the/i,['oblique']], [/core|abs/i,['abs']], [/glute|outer hip|it band/i,['glute']], [/hamstring/i,['ham']],
  [/quad/i,['quad']], [/calf|calves|achilles|ankle/i,['calf']], [/hip flexor/i,['hipflex']], [/\bhips?\b/i,['hipflex','glute']],
  [/inner thigh|groin|adductor/i,['adductor']], [/whole body/i,['quad','ham','glute','abs','chest','lat']]
];
function musRegions(names){
  const out = [];
  for(const nm of (names||[])) for(const [re, regs] of MM_MAP) if(re.test(nm)){ for(const r of regs) if(!out.includes(r)) out.push(r); break; }
  return out;
}
function bodySil(cx){
  const L = (x1,y1,x2,y2,w) => '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke-width="'+w+'"/>';
  return '<g class="mmbody"><circle cx="'+cx+'" cy="18" r="12"/>'+
    '<path d="M'+(cx-24)+' 40 Q'+cx+' 33 '+(cx+24)+' 40 L'+(cx+20)+' 100 Q'+cx+' 108 '+(cx-20)+' 100 Z"/>'+
    '<path d="M'+(cx-20)+' 98 L'+(cx+20)+' 98 L'+(cx+22)+' 124 Q'+cx+' 131 '+(cx-22)+' 124 Z"/>'+
    '<rect x="'+(cx-5)+'" y="27" width="10" height="10"/>'+
    L(cx-26,44,cx-31,90,11)+L(cx-31,90,cx-34,132,9)+L(cx+26,44,cx+31,90,11)+L(cx+31,90,cx+34,132,9)+
    L(cx-11,122,cx-13,172,17)+L(cx-13,172,cx-13,214,12)+L(cx+11,122,cx+13,172,17)+L(cx+13,172,cx+13,214,12)+
    '<circle cx="'+(cx-34)+'" cy="139" r="5"/><circle cx="'+(cx+34)+'" cy="139" r="5"/>'+
    '<ellipse cx="'+(cx-14)+'" cy="220" rx="7" ry="4"/><ellipse cx="'+(cx+14)+'" cy="220" rx="7" ry="4"/></g>';
}
/* heat: {region: 0..1}; or primary/secondary lists */
function muscleMapSVG(o){
  const heat = o.heat || {};
  if(!o.heat){ for(const r of (o.secondary||[])) heat[r] = Math.max(heat[r]||0, 0.45); for(const r of (o.primary||[])) heat[r] = 1; }
  let regs = '';
  for(const k in MM_REG){
    const v = heat[k]||0;
    regs += '<g class="mmreg'+(v?' on':'')+'" style="'+(v?'fill-opacity:'+(0.25+0.75*v).toFixed(2):'')+'">'+MM_REG[k]+'</g>';
  }
  return '<svg class="mmsvg" viewBox="0 0 240 230" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
    bodySil(60)+bodySil(180)+regs+
    '<text x="60" y="229" text-anchor="middle" class="mmlbl">FRONT</text><text x="180" y="229" text-anchor="middle" class="mmlbl">BACK</text></svg>';
}
function musclesCard(names, title){
  const regs = musRegions(names);
  if(!regs.length) return '';
  const prim = musRegions(names.slice(0,1)), sec = regs.filter(r=>!prim.includes(r));
  return '<div class="card mmcard"><div class="between"><span class="klabel">'+esc(title||'Muscles worked')+'</span>'+
      '<span class="mmleg"><i class="p"></i>Primary <i class="s"></i>Secondary</span></div>'+
    muscleMapSVG({primary:prim, secondary:sec})+
    '<div class="stchips" style="justify-content:center">'+names.map((m,i)=>'<span class="chip '+(i?'dimc':'goodc')+'">'+esc(m)+'</span>').join('')+'</div></div>';
}
/* sets per region over the last 7 days, scaled to the busiest region */
function weeklyMuscleHeat(){
  const since = fmtD(new Date(Date.now()-6*86400000)), tally = {};
  for(const w of (S.workouts||[])){
    if(w.date < since) continue;
    for(const ex of (w.exercises||[])){
      const E = EXDB[ex.exerciseId]; if(!E) continue;
      const n = (ex.sets||[]).filter(s=>!s.warmup).length; if(!n) continue;
      const regs = musRegions(E.mus||[]), prim = musRegions((E.mus||[]).slice(0,1));
      for(const r of regs) tally[r] = (tally[r]||0) + n*(prim.includes(r)?1:0.5);
    }
  }
  const mx = Math.max(0, ...Object.values(tally)); const heat = {};
  if(mx) for(const r in tally) heat[r] = tally[r]/mx;
  return {heat, total:Object.keys(tally).length};
}

/* ---------- your own photos ---------- */
function photoOf(id){ return (S.photos && S.photos[id]) || null; }
function savePhoto(id, dataUrl){
  if(!S.photos) S.photos = {};
  S.photos[id] = dataUrl;
  try{ save(); }
  catch(err){ delete S.photos[id]; toast('Storage full — try a smaller photo'); return false; }
  return true;
}
function readPhoto(file, cb){
  const fr = new FileReader();
  fr.onload = function(){
    const img = new Image();
    img.onload = function(){
      const max = 520, sc = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let out; try{ out = c.toDataURL('image/jpeg',0.62); }catch(e){ out = fr.result; }
      cb(out);
    };
    img.onerror = function(){ toast('Could not read that image'); };
    img.src = fr.result;
  };
  fr.onerror = function(){ toast('Could not read that image'); };
  fr.readAsDataURL(file);
}

/* media block used at the top of the exercise page */
function figBlock(id){

  let bar = '';

      '<button class="'+(UI.figView!=='v2'?'on':'')+'" data-a="fig-view" data-v="v1">'+esc(viewLabel(id))+' view</button>'+
      '<button class="'+(UI.figView==='v2'?'on':'')+'" data-a="fig-view" data-v="v2">'+esc(viewLabel(id,'v2'))+' view</button>'+
    '</div>';
  }
  bar += '<div class="figbar">';
  if(has){
    bar += '<button class="chip'+(!showPhoto?' goodc':'')+'" data-a="fig-shot" data-v="0">Diagram</button>'+
           '<button class="chip'+(showPhoto?' goodc':'')+'" data-a="fig-shot" data-v="1">My photo</button>';

  if(!showPhoto && cfg){
    bar += '<button class="chip" data-a="fig-mode">'+(UI.figMode==='both'?'▶ Animate':'⇄ Side by side')+'</button>';
  }
  bar += '<button class="chip dimc" data-a="fig-add">'+(has?'Replace photo':'+ Add your photo')+'</button>';
  if(has) bar += '<button class="chip dimc" data-a="fig-del">Remove</button>';

  return '<div class="card">'+body+labels+bar+'</div>';
}

document.addEventListener('click', function(e){

document.addEventListener('change', function(e){

});
