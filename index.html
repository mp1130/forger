<script>
/* =================== RUN =================== */
const MI = 1609.344;
function haversine(a, b){
  const R=6371000, t=Math.PI/180;
  const dLat=(b[0]-a[0])*t, dLon=(b[1]-a[1])*t;
  const la1=a[0]*t, la2=b[0]*t;
  const h=Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}
function ptsMeters(pts){ let m=0; for(let i=1;i<pts.length;i++) m+=haversine(pts[i-1],pts[i]); return m; }
function fmtMi(m){ return (m/MI).toFixed(2); }
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h? h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0') : m+':'+String(s).padStart(2,'0');
}
function pace(sec, meters){
  if(!meters || meters<40 || !sec) return '—';
  const p = sec/(meters/MI);
  if(!isFinite(p) || p>3600) return '—';
  return Math.floor(p/60)+':'+String(Math.round(p%60)).padStart(2,'0');
}
function splitsOf(pts){
  const out=[]; let d=0, lastT=pts.length?pts[0][2]:0, mark=MI;
  for(let i=1;i<pts.length;i++){
    d += haversine(pts[i-1],pts[i]);
    while(d>=mark){
      out.push({mi:out.length+1, sec:(pts[i][2]-lastT)/1000});
      lastT=pts[i][2]; mark+=MI;
    }
  }
  const rem=d-(mark-MI);
  if(rem>80 && pts.length) out.push({mi:out.length+1, sec:(pts[pts.length-1][2]-lastT)/1000, part:rem/MI});
  return out;
}

/* ---------- route drawing (no tiles, no network) ----------
   Colour-coded by mile so a route that crosses itself still reads, and
   repeated ground gets nudged sideways into parallel tracks. */
const MILECOLS = ['#ff8a3d','#5b9dff','#35d07f','#f5b849','#b478ff','#ff5f8a','#2ec4c4','#dfe6ef'];
const PACECOLS = ['#3f77cc','#6f9ad8','#8593a5','#ffa552','#ff7a1f'];
const mileCol = i => MILECOLS[i % MILECOLS.length];

/* project lat/lng into the box, then push repeated ground apart */
/* street map: Web Mercator, the same projection the map tiles use */
const TILE = 256;
const mercX = (lng, z) => (lng+180)/360*TILE*Math.pow(2,z);
const mercY = (lat, z) => { const sn=Math.sin(lat*Math.PI/180); return (0.5-Math.log((1+sn)/(1-sn))/(4*Math.PI))*TILE*Math.pow(2,z); };
function mapFit(pts, W, H, pad, me){
  const all = (pts||[]).slice(); if(me) all.push([me.lat, me.lng]);
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const p of all){ const x=mercX(p[1],0), y=mercY(p[0],0); x0=Math.min(x0,x); x1=Math.max(x1,x); y0=Math.min(y0,y); y1=Math.max(y1,y); }
  const sx=Math.max(x1-x0,1e-9), sy=Math.max(y1-y0,1e-9);
  let z = Math.floor(Math.log2(Math.min((W-2*pad)/sx, (H-2*pad)/sy)));
  z = Math.max(3, Math.min(all.length<2 ? 16 : 17, z));
  const k=Math.pow(2,z), ox=(x0+x1)/2*k-W/2, oy=(y0+y1)/2*k-H/2;
  return {z, ox, oy, xy:(pts||[]).map(p=>[mercX(p[1],z)-ox, mercY(p[0],z)-oy]), at:(lat,lng)=>[mercX(lng,z)-ox, mercY(lat,z)-oy]};
}
function project(pts, W, H, pad){ return mapFit(pts, W, H, pad).xy; }
/* tiles one zoom deeper drawn at half size, so streets stay sharp on phone screens */
function tilesHTML(fit, W, H){
  if(S && S.settings && S.settings.mapTiles===false) return '';
  const zt=Math.min(fit.z+1,19), size=TILE/2, n=Math.pow(2,zt);
  const tx0=Math.floor(fit.ox/size), tx1=Math.floor((fit.ox+W)/size), ty0=Math.floor(fit.oy/size), ty1=Math.floor((fit.oy+H)/size);
  let h='';
  for(let tx=tx0; tx<=tx1; tx++) for(let ty=ty0; ty<=ty1; ty++){
    if(ty<0||ty>=n) continue;
    const wx=((tx%n)+n)%n, L=(tx*size-fit.ox)/W*100, T=(ty*size-fit.oy)/H*100;
    h+='<img class="maptile" alt="" draggable="false" referrerpolicy="origin" src="https://tile.openstreetmap.org/'+zt+'/'+wx+'/'+ty+'.png" style="left:'+L.toFixed(3)+'%;top:'+T.toFixed(3)+'%;width:'+(size/W*100).toFixed(3)+'%;height:'+(size/H*100).toFixed(3)+'%">';
  }
  return '<div class="maptiles">'+h+'</div><span class="mapattr">© OpenStreetMap</span>';
}
function spreadOverlaps(xy, gap){
  const CELL=7, seen={}, last={}, lvl=new Array(xy.length).fill(0);
  for(let i=0;i<xy.length;i++){
    const k=Math.round(xy[i][0]/CELL)+','+Math.round(xy[i][1]/CELL);
    if(last[k]===undefined || i-last[k]>40) seen[k]=(seen[k]||0)+1;   // a genuinely separate pass
    last[k]=i;
    lvl[i]=(seen[k]||1)-1;
  }
  // smooth the level so the line doesn't jitter between passes
  const sm=lvl.slice();
  for(let i=2;i<xy.length-2;i++){
    const win=[lvl[i-2],lvl[i-1],lvl[i],lvl[i+1],lvl[i+2]].sort((a,b)=>a-b);
    sm[i]=win[2];
  }
  return xy.map((p,i)=>{
    if(!sm[i]) return p;
    const a=xy[Math.max(0,i-2)], b=xy[Math.min(xy.length-1,i+2)];
    let dx=b[0]-a[0], dy=b[1]-a[1], m=Math.hypot(dx,dy)||1;
    const s=sm[i]*gap*(sm[i]%2? 1 : -1);
    return [p[0]-(dy/m)*s, p[1]+(dx/m)*s];
  });
}
function paceBucket(secPerMi, avg){
  if(!isFinite(secPerMi)||!avg) return 2;
  const r=secPerMi/avg;
  if(r<0.90) return 4; if(r<0.97) return 3; if(r<1.03) return 2; if(r<1.12) return 1; return 0;
}
function meDot(fit, me){
  if(!me) return '';
  const [x,y]=fit.at(me.lat, me.lng);
  const mpp=156543.03392*Math.cos(me.lat*Math.PI/180)/Math.pow(2,fit.z), r=Math.max(6, Math.min(140, (me.acc||10)/mpp));
  return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r.toFixed(1)+'" class="meacc"/>'+
         '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="6.5" class="medot"/>';
}
function routeSVG(pts, h, opts){
  const o=opts||{}, W=340, H=h||170, pad=18;
  if((!pts || pts.length<2) && !o.me) return '<div class="mapempty">No GPS trace yet — the route draws itself as you move.</div>';
  const fit = mapFit(pts&&pts.length>1?pts:[], W, H, pad, o.me);
  if(!pts || pts.length<2){
    return tilesHTML(fit,W,H)+'<svg class="mapsvg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+meDot(fit,o.me)+'</svg>';
  }
  const xy = spreadOverlaps(fit.xy, 3.1);

  // per-point mile index + per-segment pace
  const mileOf=new Array(pts.length).fill(0), segPace=new Array(pts.length).fill(0);
  let acc=0, marks='';
  const markAt=[];
  for(let i=1;i<pts.length;i++){
    const d=haversine(pts[i-1],pts[i]);
    const dt=Math.max(0.4,(pts[i][2]-pts[i-1][2])/1000);
    segPace[i]= d>0 ? dt/(d/MI) : 0;
    const before=Math.floor(acc/MI);
    acc+=d;
    const after=Math.floor(acc/MI);
    mileOf[i]=after;
    if(after>before) markAt.push([i,after]);
  }
  mileOf[0]=0;
  const totalSec=(pts[pts.length-1][2]-pts[0][2])/1000;
  const avgPace = acc>0 ? totalSec/(acc/MI) : 0;
  const mode = o.mode==='pace' ? 'pace' : 'mile';
  const hi = (o.hi==null||o.hi==='') ? null : +o.hi;

  // build one path per colour run so overlapping ground stays distinguishable
  let paths='', cur=null, d='';
  const flush=()=>{ if(cur!==null && d){
      const dim = (mode==='mile' && hi!=null && cur.mi!==hi);
      paths+='<path class="rsegu" d="'+d+'" stroke-width="'+(dim?4:6.6)+'"/>'+'<path class="rseg" d="'+d+'" stroke="'+cur.col+'" stroke-width="'+(dim?2.2:3.6)+
        '" stroke-linecap="round" stroke-linejoin="round" opacity="'+(dim?0.22:1)+'"/>'; } };
  for(let i=1;i<pts.length;i++){
    const col = mode==='pace' ? PACECOLS[paceBucket(segPace[i],avgPace)] : mileCol(mileOf[i]);
    const key = col+'|'+mileOf[i];
    if(!cur || cur.key!==key){
      flush();
      cur={key,col,mi:mileOf[i]};
      d='M'+xy[i-1][0].toFixed(1)+' '+xy[i-1][1].toFixed(1);
    }
    d+=' L'+xy[i][0].toFixed(1)+' '+xy[i][1].toFixed(1);
  }
  flush();

  for(const [i,n] of markAt){
    marks+='<circle cx="'+xy[i][0].toFixed(1)+'" cy="'+xy[i][1].toFixed(1)+'" r="7" fill="var(--bg)" opacity=".85"/>'+
           '<circle cx="'+xy[i][0].toFixed(1)+'" cy="'+xy[i][1].toFixed(1)+'" r="7" fill="none" stroke="'+mileCol(n-1)+'" stroke-width="1.6"/>'+
           '<text x="'+xy[i][0].toFixed(1)+'" y="'+(xy[i][1]+2.9).toFixed(1)+'" text-anchor="middle" class="mkn">'+n+'</text>';
  }
  const a=xy[0], b=xy[xy.length-1];
  return tilesHTML(fit,W,H)+'<svg class="mapsvg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+
    paths+marks+meDot(fit,o.me)+
    '<circle cx="'+a[0].toFixed(1)+'" cy="'+a[1].toFixed(1)+'" r="5" fill="var(--good)" stroke="var(--bg)" stroke-width="1.5"/>'+
    '<circle cx="'+b[0].toFixed(1)+'" cy="'+b[1].toFixed(1)+'" r="5" fill="var(--accent)" stroke="var(--bg)" stroke-width="1.5"/>'+
  '</svg>';
}
function mileLegend(pts, mode, hi){
  const n = Math.max(1, Math.ceil(ptsMeters(pts)/MI));
  if(mode==='pace'){
    return '<div class="legend">'+
      '<span class="lgl">Slower</span>'+
      PACECOLS.map(c=>'<i style="background:'+c+'"></i>').join('')+
      '<span class="lgl">Faster</span></div>';
  }
  let out='<div class="legend">';
  for(let i=0;i<n;i++){
    out+='<button class="mchip'+(hi==i?' on':'')+'" data-a="map-hi" data-mi="'+i+'">'+
      '<i style="background:'+mileCol(i)+'"></i>'+(i+1)+'</button>';
  }
  if(hi!=null) out+='<button class="mchip" data-a="map-hi" data-mi="">All</button>';
  return out+'</div>';
}
/* ---------- live tracking ---------- */
let watchId=null, runTick=null, wakeLock=null, gpsAcc=null, lastFix=null;
function runState(){ return S.runActive; }
function runElapsed(){
  const r=S.runActive; if(!r) return 0;
  return (r.accum||0) + (r.paused? 0 : (Date.now()-r.resumedAt)/1000);
}
async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); }
    else if(wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){}
}
function onPos(pos){
  const r=S.runActive; if(!r || r.paused) return;
  const c=pos.coords;
  gpsAcc = c.accuracy;
  const firstFix = !lastFix;
  lastFix = {lat:c.latitude, lng:c.longitude, acc:c.accuracy, t:Date.now()};
  if(firstFix){ const mp=$('#rv-map'); if(mp) mp.innerHTML=routeSVG(r.pts,170,{mode:'mile', me:lastFix}); }
  if(c.accuracy>35) { paintLive(); return; }              // too fuzzy to count distance
  const p=[+c.latitude.toFixed(6), +c.longitude.toFixed(6), Date.now()];
  const last=r.pts[r.pts.length-1];
  if(last){
    const d=haversine(last,p);
    if(d<2.5) { paintLive(); return; }                     // standing still
    if(d>200 && (p[2]-last[2])<4000) { return; }           // GPS jump, drop it
  }
  r.pts.push(p);
  if(r.pts.length%6===0) save();
  paintLive();
}
function onGpsErr(err){
  gpsAcc=null;
  if(err && err.code===1){ stopWatch(); sheetGpsHelp(1); }
  paintLive();
}
function startWatch(){
  if(!navigator.geolocation){ toast('This browser has no GPS'); return false; }
  stopWatch();
  watchId = navigator.geolocation.watchPosition(onPos, onGpsErr,
    {enableHighAccuracy:true, maximumAge:2000, timeout:20000});
  return true;
}
function stopWatch(){
  if(watchId!=null && navigator.geolocation) navigator.geolocation.clearWatch(watchId);
  watchId=null;
}
function sheetGpsHelp(code){
  const why = code==='insecure' ? 'This page isn\u2019t on a secure https link, and phones only give location to secure pages.'
            : code===1 ? 'Your phone is blocking location for this site.'
            : code===2 ? 'Your phone could not get a GPS fix. That happens indoors and under heavy cover.'
            : code===3 ? 'GPS took too long to answer.'
            : 'This browser has no location service.';
  const steps = code===1 ? '<ol class="helpsteps">'+
      '<li>Open <b>Settings</b> on your iPhone, tap <b>Privacy &amp; Security</b>, then <b>Location Services</b>, and make sure it is on.</li>'+
      '<li>Scroll down, tap <b>Safari Websites</b>, choose <b>While Using the App</b>, and turn on <b>Precise Location</b>.</li>'+
      '<li>Come back to this page in Safari, tap the page menu button in the address bar, tap <b>Website Settings</b>, and set <b>Location</b> to <b>Allow</b>.</li>'+
      '<li>If you use the home screen icon, delete it and add it again after changing these.</li></ol>'
    : code===2||code===3 ? '<ol class="helpsteps"><li>Step outside or stand by a window.</li><li>Give it 20 to 30 seconds, then tap Check GPS again.</li><li>Make sure <b>Precise Location</b> is on: Settings, Privacy &amp; Security, Location Services, Safari Websites.</li></ol>'
    : code==='insecure' ? '<ol class="helpsteps"><li>Open the app from its https link (the github.io address), not a saved file.</li></ol>' : '';
  openSheet('<div class="disp h2">GPS isn\u2019t reaching the app</div><div class="sub mt6">'+why+'</div>'+steps+
    '<button class="btn primary mt14" data-a="gps-check">Check GPS again</button>'+
    '<button class="btn ghost mt10" data-a="sheet-close">Close</button>');
}
function gpsCheck(){
  if(typeof window!=='undefined' && window.isSecureContext===false){ sheetGpsHelp('insecure'); return; }
  if(!navigator.geolocation){ sheetGpsHelp(0); return; }
  openSheet('<div class="disp h2">Checking GPS…</div><div class="sub mt6">Allow location if your phone asks.</div>');
  navigator.geolocation.getCurrentPosition(pos=>{
    const c=pos.coords; lastFix={lat:c.latitude, lng:c.longitude, acc:c.accuracy, t:Date.now()};
    const good = c.accuracy<=35;
    openSheet('<div class="disp h2">'+(good?'GPS is working ✓':'GPS is on, signal is weak')+'</div>'+
      '<div class="sub mt6 num">Accurate to about '+Math.round(c.accuracy)+' m'+(good?'':' — step outside for a tighter fix')+'</div>'+
      '<div class="mapbox mt12">'+routeSVG([],190,{me:lastFix})+'</div>'+
      '<div class="fine mt6">The blue dot is you. The ring shows how sure the phone is.</div>'+
      '<button class="btn primary mt14" data-a="sheet-close">Done</button>');
  }, err=>sheetGpsHelp(err&&err.code), {enableHighAccuracy:true, timeout:20000, maximumAge:0});
}
function runBegin(){
  if(S.runActive){ toast('A run is already going'); return; }

  const pid = UI.planId||'free', ph = planPhases(pid);
  S.runActive = {startedAt:Date.now(), resumedAt:Date.now(), accum:0, paused:false, pts:[],
                 plan: ph? pid : null, phases: ph, phaseIdx:0, phaseStart:0, cue:{mi:0,min:0,mid:false}};
  if(!startWatch()){ S.runActive=null; return; }

}
function runPause(){
  const r=S.runActive; if(!r||r.paused) return;

  stopWatch(); keepAwake(false); shutUp(); say('Paused.', false, 'paused'); save(); render();
}
function runResume(){

}
function runFinish(){

    '<button class="btn mt10" data-a="run-save">Save run</button>'+

function runSave(){
  const r=S.runActive; if(!r) return;

  S.runs.unshift({
    id:uid(), date:fmtD(new Date(r.startedAt)), startedAt:r.startedAt,
    sec:Math.round(sec), meters:Math.round(meters),

    note:(noteEl&&noteEl.value||'').trim(), who:'me', plan:(r.plan? planById(r.plan).name : null)

/* thin the trace so storage and share codes stay small */
function simplify(pts){
  if(pts.length<3) return pts.slice();
  const out=[pts[0]];
  for(let i=1;i<pts.length-1;i++) if(haversine(out[out.length-1],pts[i])>=8) out.push(pts[i]);
  out.push(pts[pts.length-1]);
  return out;
}
/* live numbers without redrawing the whole screen */
function liveTimer(on){
  if(runTick){ clearInterval(runTick); runTick=null; }
  if(on) runTick=setInterval(paintLive, 1000);
}
function paintLive(){
  const r=S.runActive; if(!r) return;
  coachTick();
  if(UI.view!=='run') return;
  const sec=runElapsed(), m=ptsMeters(r.pts);
  const setT=(id,v)=>{ const el=$('#'+id); if(el) el.textContent=v; };
  setT('rv-dist', fmtMi(m)); setT('rv-time', fmtDur(sec)); setT('rv-pace', pace(sec,m));
  setT('rv-splits', String(Math.floor(m/MI)));

      const nm=bar&&bar.querySelector('.pn'); if(nm && nm.textContent!==cur.l) render(true);

  if(g) g.innerHTML='<span class="gpsdot '+(gpsAcc==null?'none':gpsAcc>25?'weak':'')+'"></span>'+

}

/* ---------- sharing: a code you paste into any messaging app ---------- */
function encPoly(pts){                       // Google-style encoded polyline
  let last0=0,last1=0,out='';
  const enc=v=>{ v=v<0? ~(v<<1) : (v<<1); let s='';
    while(v>=0x20){ s+=String.fromCharCode((0x20|(v&0x1f))+63); v>>=5; }
    return s+String.fromCharCode(v+63); };
  for(const p of pts){
    const a=Math.round(p[0]*1e5), b=Math.round(p[1]*1e5);
    out+=enc(a-last0)+enc(b-last1); last0=a; last1=b;
  }
  return out;
}
function decPoly(str){
  const pts=[]; let i=0,lat=0,lng=0;
  while(i<str.length){
    let b,sh=0,res=0;
    do{ b=str.charCodeAt(i++)-63; res|=(b&0x1f)<<sh; sh+=5; }while(b>=0x20);
    lat += (res&1)? ~(res>>1) : (res>>1);
    sh=0; res=0;
    do{ b=str.charCodeAt(i++)-63; res|=(b&0x1f)<<sh; sh+=5; }while(b>=0x20);
    lng += (res&1)? ~(res>>1) : (res>>1);
    pts.push([lat/1e5, lng/1e5, 0]);
  }
  return pts;
}
function b64e(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(str){ str=str.replace(/-/g,'+').replace(/_/g,'/'); return decodeURIComponent(escape(atob(str))); }
function runCode(run){
  const who = (S.profile.runnerName||'').trim() || 'A friend';
  const payload = {n:who, d:run.date, m:run.meters, s:run.sec, p:encPoly(run.pts||[]), t:run.note||''};
  return 'FORGE1.'+b64e(JSON.stringify(payload));
}
function parseCode(txt){
  const m = String(txt||'').trim().match(/FORGE1\.([A-Za-z0-9\-_]+)/);
  if(!m) return null;
  try{
    const o = JSON.parse(b64d(m[1]));
    if(!o || !o.m || !o.s) return null;
    return {id:uid(), who:'crew', name:String(o.n||'Friend').slice(0,24), date:o.d, meters:+o.m, sec:+o.s,
            note:String(o.t||'').slice(0,90), pts:o.p? decPoly(o.p):[], splits:[]};
  }catch(e){ return null; }
}
function sheetRunShare(id){
  const run = S.runs.find(r=>r.id===id); if(!run) return;
  const code = runCode(run);
  openSheet('<div class="disp h2">Share this run</div>'+

    '<div style="height:16px"></div>';
}
function rRunLive(r){
  const sec=runElapsed(), m=ptsMeters(r.pts);
  return '<div class="plhead">'+
      '<button class="btn small ghost" data-a="nav" data-v="home">‹</button>'+
      '<div class="plmid"><span class="klabel">'+(r.paused?'Paused':'Running')+'</span>'+
        '<span class="plclock num" id="rv-time">'+fmtDur(sec)+'</span></div>'+

    '</div>'+
    rPhaseBar(r)+
    '<div class="runhero">'+
      '<div class="klabel" id="rv-gps"><span class="gpsdot none"></span>Waiting for GPS</div>'+

        ? '<button class="btn primary mt14" data-a="run-resume">Resume</button>'

function rRunDetail(){
  const id=UI.runId, crew=(S.crew||[]).find(x=>x.id===id);
  const run = crew || S.runs.find(x=>x.id===id);
  if(!run) return '<div class="card">Run not found.</div>';
  const sp = run.splits && run.splits.length ? run.splits : splitsOf(run.pts||[]);
  const worst = sp.reduce((a,b)=>Math.max(a, b.sec/(b.part||1)), 1);
  return '<div class="row mb10"><button class="btn small ghost" data-a="nav" data-v="run">‹ Run</button></div>'+
    '<div class="pagehead"><div><div class="klabel">'+esc(crew? crew.name : shortD(run.date))+

      '<button class="'+((UI.mapMode||'mile')==='mile'?'on':'')+'" data-a="map-mode" data-v="mile">By mile</button>'+

    '</div>'+
    '<div class="mapbox">'+routeSVG(run.pts,190,{mode:(UI.mapMode||'mile'), hi:UI.mapHi})+'</div>'+
    ((run.pts&&run.pts.length>1)? mileLegend(run.pts,(UI.mapMode||'mile'),UI.mapHi) : '')+
    ((UI.mapMode||'mile')==='mile'? '<div class="fine mt6">Every mile gets its own colour, and ground you cover twice is drawn as parallel tracks — so an out-and-back still reads.</div>':'')+
    '<div class="statgrid mt12">'+
      '<div class="stat"><div class="sv num">'+fmtDur(run.sec)+'</div><div class="sk">Time</div></div>'+

    '</div>'+
    (run.note? '<div class="card mt12"><span class="klabel">Note</span><div class="mt6">'+esc(run.note)+'</div></div>':'')+
    (sp.length? '<div class="card mt12"><span class="klabel">Splits</span>'+
      sp.map((x,i)=>'<div class="splitrow'+(UI.mapHi==i?' on':'')+'" data-a="map-hi" data-mi="'+(UI.mapHi==i?'':i)+'">'+
        '<span class="sdot" style="background:'+mileCol(i)+'"></span>'+
        '<span class="sn">'+(x.part? 'FIN':'MI '+x.mi)+'</span>'+
        '<span class="sbar"><i style="width:'+Math.round(100*(x.sec/(x.part||1))/worst)+'%;background:'+mileCol(i)+'"></i></span>'+
        '<span class="st num">'+fmtDur(x.sec)+'</span></div>').join('')+
      '<div class="fine mt10">Tap a split to pick that mile out on the map.</div></div>' : '')+
    (crew? '' :
      '<button class="btn mt12" data-a="run-share" data-id="'+run.id+'">Share this run</button>')+
    '<button class="btn ghost danger mt10" data-a="run-del" data-id="'+run.id+'">Delete run</button>'+
    '<div style="height:16px"></div>';
}

/* ---------- actions ---------- */
document.addEventListener('click', function(e){
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a, id=b.dataset.id;
  switch(a){
    case 'run-begin':  runBegin(); break;
    case 'gps-check':  gpsCheck(); break;
    case 'plan-pick':  UI.planId=id; render(true); break;
    case 'coach-on':   coachCfg().on=!coachCfg().on; save(); render(true); break;
    case 'coach-lines-save': {
      const t=$('#coach-lines'); if(!t) break;
      coachCfg().lines = t.value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,20);
      coachCfg().lineIdx=0; save(); render(true); toast(coachCfg().lines.length? 'Lines saved':'Back to the built-in lines'); break; }
    case 'rr-toggle':  { S.runReady=S.runReady||{}; S.runReady[D_(b)]=!S.runReady[D_(b)]; save(); render(true); if(runReadyOK()) playClip('levelup'); break; }
    case 'rr-reset':   { S.runReady={}; save(); render(true); break; }
    case 'coach-every':coachCfg().every=b.dataset.v; save(); render(true); break;
    case 'coach-style':{ coachCfg().style=b.dataset.v; save(); render(true);
      if(b.dataset.v!=='off') say('Coach set.', true, 'go'); break; }
    case 'coach-tp': {
      const c=coachCfg(), dd=+b.dataset.d;
      if(dd===0) c.targetPace=0;
      else c.targetPace=Math.max(0, Math.min(1800, (c.targetPace||600)+dd));
      save(); render(true); break; }
    case 'map-mode':   UI.mapMode=b.dataset.v; UI.mapHi=null; render(true); break;
    case 'map-hi':     UI.mapHi=(b.dataset.mi===''? null : +b.dataset.mi); render(true); break;
    case 'run-pause':  runPause(); break;
    case 'run-resume': runResume(); liveTimer(true); break;
    case 'run-finish': runFinish(); break;
    case 'run-save':   runSave(); break;
    case 'run-save-stretch': runSave(); stretchStart(RUN_COOLDOWN, 'Runner\u2019s cool-down', 'run', 'run'); break;
    case 'run-discard':
      confirmSheet('Discard run?','The GPS trace will be thrown away.','Discard',()=>{
        S.runActive=null; liveTimer(false); stopWatch(); keepAwake(false); save(); closeSheet(); render(); });
      break;
    case 'run-open':   UI.runId=id; UI.mapHi=null; nav('rundetail'); break;
    case 'crew-open':  UI.runId=id; UI.mapHi=null; nav('rundetail'); break;
    case 'run-share':  sheetRunShare(id); break;
    case 'run-paste':  sheetRunPaste(); break;
    case 'run-copy': {
      const t=$('#sharecode'); if(!t) break;
      t.select();
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(()=>toast('Copied')).catch(()=>toast('Select and copy'));
      else { try{ document.execCommand('copy'); toast('Copied'); }catch(err){ toast('Select and copy'); } }
      break; }
    case 'run-paste-go': {
      const t=$('#pastecode');
      const r=parseCode(t&&t.value);
      if(!r){ toast('That code did not look right'); break; }
      S.crew = S.crew||[];
      S.crew.unshift(r);
      if(S.crew.length>30) S.crew.length=30;
      save(); closeSheet(); render(); toast(r.name+'\u2019s run added');
      break; }
    case 'run-del':
      confirmSheet('Delete run?','This removes the run and its route.','Delete',()=>{
        S.runs=S.runs.filter(x=>x.id!==id);
        S.crew=(S.crew||[]).filter(x=>x.id!==id);
        save(); closeSheet(); UI.view='run'; render();
      });
      break;
  }
});
/* re-grab the wake lock when coming back to the tab mid-run */
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible' && S.runActive && !S.runActive.paused){
    keepAwake(true);
    if(watchId==null) startWatch();
    liveTimer(true);
  }
});

<script>
/* =================== COACH ===================
   Spoken cues through the browser's own speech engine — no audio files,
   no network, nothing to download. */

const RUNPLANS = [
  {id:'free',  name:'Free run',        desc:'Just go. Cues at every mile.'},
  {id:'easy30',name:'Easy 30',         desc:'30 min conversational pace',
   phases:[{l:'Warm up',t:'warm',sec:300},{l:'Easy',t:'easy',sec:1500},{l:'Cool down',t:'cool',sec:300}]},
  {id:'walkrun',name:'Walk / run build',desc:'6 × (3 min run · 2 min walk)',
   build:()=>{ const p=[{l:'Warm up walk',t:'warm',sec:300}];
     for(let i=0;i<6;i++){ p.push({l:'Run',t:'hard',sec:180}); p.push({l:'Walk',t:'easy',sec:120}); }
     p.push({l:'Cool down walk',t:'cool',sec:300}); return p; }},
  {id:'int42', name:'4 × 2 min hard',  desc:'10 warm · 4 × (2 hard / 2 easy) · 5 cool',
   build:()=>{ const p=[{l:'Warm up',t:'warm',sec:600}];
     for(let i=0;i<4;i++){ p.push({l:'Hard',t:'hard',sec:120}); p.push({l:'Easy',t:'easy',sec:120}); }
     p.push({l:'Cool down',t:'cool',sec:300}); return p; }},
  {id:'tempo', name:'Tempo 20',        desc:'10 warm · 20 steady · 5 cool',
   phases:[{l:'Warm up',t:'warm',sec:600},{l:'Tempo',t:'hard',sec:1200},{l:'Cool down',t:'cool',sec:300}]},
  {id:'long',  name:'Long slow',       desc:'60 min, stay easy the whole way',
   phases:[{l:'Warm up',t:'warm',sec:300},{l:'Long easy',t:'easy',sec:3000},{l:'Cool down',t:'cool',sec:300}]},
  {id:'return1', name:'Return to run · stage 1', desc:'8 × (1 min run · 2 min walk) — after the run-ready check', only:'forger',
   build:()=>{ const p=[{l:'Warm up walk',t:'warm',sec:300}];
     for(let i=0;i<8;i++){ p.push({l:'Run easy',t:'hard',sec:60}); p.push({l:'Walk',t:'easy',sec:120}); }
     p.push({l:'Cool down walk',t:'cool',sec:300}); return p; }},
  {id:'return2', name:'Return to run · stage 2', desc:'6 × (3 min run · 1 min walk)', only:'forger',
   build:()=>{ const p=[{l:'Warm up walk',t:'warm',sec:300}];
     for(let i=0;i<6;i++){ p.push({l:'Run easy',t:'hard',sec:180}); p.push({l:'Walk',t:'easy',sec:60}); }
     p.push({l:'Cool down walk',t:'cool',sec:300}); return p; }}
];
const planById = id => RUNPLANS.find(p=>p.id===id) || RUNPLANS[0];
function planPhases(id){
  const p=planById(id);
  return p.build? p.build() : (p.phases? p.phases.map(x=>Object.assign({},x)) : null);
}
function planTotal(id){
  const ph=planPhases(id); if(!ph) return 0;
  return ph.reduce((a,b)=>a+b.sec,0);
}

const OPENERS = [
  'Let\u2019s work. Start easy, the pace comes to you.',
  'First mile is a warm-up, not a race. Settle in.',
  'Good. Relax the shoulders, breathe through it.',
  'Easy start. You have got plenty of road left.'
];
const MIDS = [
  'Still smooth. Keep the effort honest.',
  'Nice and steady. Hold this.',
  'Good rhythm. Stay tall through the hips.',
  'Halfway feeling. Keep the breathing even.'
];
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
/* lines she typed in herself get used first, in rotation */
function coachOwnLine(){
  const c = coachCfg(); const L = (c.lines||[]).map(x=>String(x).trim()).filter(Boolean);
  if(!L.length) return '';
  c.lineIdx = ((c.lineIdx||0) % L.length);
  const out = L[c.lineIdx]; c.lineIdx = (c.lineIdx+1) % L.length;
  return out;
}

function coachCfg(){
  const c = S.settings.coach || (S.settings.coach = {on:true, every:'mile', targetPace:0, style:'coach'});
  return c;
}


/* speech reads "9 minutes 41 seconds" reliably; "9:41" it does not */
function spokenTime(sec){
  sec=Math.max(0,Math.round(sec));
  const m=Math.floor(sec/60), s=sec%60;
  if(!m) return s+' seconds';
  return m+' minute'+(m===1?'':'s')+(s? ' '+s+' second'+(s===1?'':'s') : '');
}
function spokenPace(sec){
  if(!isFinite(sec)||!sec) return 'unknown';
  return spokenTime(sec)+' per mile';
}
function targetDeltaLine(paceSec){
  const t = coachCfg().targetPace;
  if(!t || !isFinite(paceSec) || !paceSec) return '';
  const d = Math.round(paceSec - t);
  if(Math.abs(d)<4) return ' Right on target.';
  return d<0 ? ' '+Math.abs(d)+' seconds per mile ahead of target.'
             : ' '+d+' seconds per mile behind target.';
}

/* ---------- the per-second brain ---------- */
function coachTick(){
  const r = S.runActive; if(!r || r.paused) return;
  const c = coachCfg();
  const sec = runElapsed(), m = ptsMeters(r.pts);
  r.cue = r.cue || {mi:0, min:0, mid:false};

  // guided-workout phases
  if(r.plan && r.phases && r.phases.length){
    const cur = r.phases[r.phaseIdx||0];
    const inPhase = sec - (r.phaseStart||0);
    const left = cur.sec - inPhase;
    if(left<=10 && !r.cue.ten){ r.cue.ten=true; if(r.phaseIdx < r.phases.length-1) say('Ten seconds.', false, 'ten'); }
    if(left<=3 && left>0 && r.cue.cd!==Math.ceil(left) && r.phaseIdx < r.phases.length-1){ r.cue.cd=Math.ceil(left); countIn(Math.ceil(left)); }
    if(left<=0){
      r.phaseIdx = (r.phaseIdx||0)+1;
      r.phaseStart = sec;
      r.cue.ten=false;
      const nx = r.phases[r.phaseIdx];
      if(nx){
        const verb = nx.t==='hard' ? 'Pick it up. ' : nx.t==='easy' ? 'Ease off. ' : '';
        say(verb + nx.l + ' · ' + fmtDur(nx.sec), false, nx.t==='hard'?'pickup':nx.t==='easy'?'easeoff':'next');
        if(nx.t==='hard' && !VOICE.urls.pickup){ const hard=r.phases.map((q,i)=>[q,i]).filter(([q])=>q.t==='hard'), idx=hard.findIndex(([q,i])=>i===r.phaseIdx);
          if(idx===hard.length-1 && hard.length>1){ shutUp(); playKeys(['final']); } else if(idx>=0 && idx<10){ shutUp(); playKeys(['round','n'+(idx+1)]); } }
      }else{
        say('Workout complete. Finish when you are ready.', false, 'done');
        r.plan=null; r.phases=null;
      }
      save();
    }
  }

  // distance cues
  const unit = c.every==='half' ? 0.5 : 1;
  const done = Math.floor((m/MI)/unit);
  if(c.every!=='5min' && done > r.cue.mi && m>50){
    r.cue.mi = done;
    const dist = (done*unit);
    const sp = splitsOf(r.pts);
    const lastSplit = sp.length? sp[sp.length-1].sec : sec;
    const avg = sec/(m/MI);
    if(c.style==='brief'){
      say(dist+(dist===1?' mile':' miles')+' · '+pace(sec,m)+' /mi avg', false, unit===0.5 && dist%1 ? 'halfmile' : 'mile');
      if(!VOICE.urls.mile && dist%1===0 && dist<=10) playKeys(['n'+dist]);
    }else{
      let line = dist+(dist===1?' mile':' miles')+'. Last split '+spokenTime(lastSplit)+'. Average '+spokenPace(avg)+'.';
      line += targetDeltaLine(avg);
      if(done>=1){ const own=coachOwnLine(); if(own) line += ' '+own; else if(!r.cue.mid && done>=2){ r.cue.mid=true; line += ' '+pick(P.mids); } }
      say(line, false, unit===0.5 && dist%1 ? 'halfmile' : 'mile');
      if(!VOICE.urls.mile && dist%1===0 && dist<=10) playKeys(['n'+dist]);
      const tp=coachCfg().targetPace; if(tp){ const dd=Math.round(avg-tp); playClip(Math.abs(dd)<4?'ontarget':dd<0?'ahead':'behind'); }
      if(done>=2 && c.style==='coach') motivate();
    }
    save();
  }

  // time cues
  if(c.every==='5min'){
    const mins = Math.floor(sec/300);
    if(mins > r.cue.min && sec>60){
      r.cue.min = mins;
      const avg = m>50 ? sec/(m/MI) : 0;
      say(fmtDur(mins*300)+' · '+fmtMi(m)+' mi'+(avg? ' · '+pace(sec,m)+' /mi avg':''), false, 'time');
      save();
    }
  }
}
function coachStartLine(){
  const c = coachCfg();
  const r = S.runActive;
  if(P.id==='forger' && !runReadyOK() && r && !r.plan) say('Run-ready check isn\u2019t finished. Keep it easy, stop at any symptom.', true, 'careful');
  if(!c.on || c.style==='off') return;
  if(r && r.phases && r.phases.length){
    const first = r.phases[0];
    say(planById(r.plan).name+' · first up: '+first.l+' · '+fmtDur(first.sec), false, 'go');
  }else if(c.style==='brief'){ say('Started.', false, 'go'); }
  else { say(coachOwnLine() || pick(P.openers), false, 'open'); }
}
function coachFinishLine(sec, meters){
  const c=coachCfg();
  if(!c.on || c.style==='off') return;
  say(pick(P.finishers)+' '+fmtMi(meters)+' mi · '+fmtDur(sec)+' · '+pace(sec,meters)+' /mi', false, 'done');
}

const D_ = b => b.dataset.id;
/* ---------- run-ready check (Goom, Donnelly & Brockwell 2019) ---------- */
const RUN_READY = [
  {id:'wk12',  n:'12+ weeks postpartum', d:'The guideline uses 12 weeks as the earliest point to plan a return to running — a guide, not a hard cut-off.'},
  {id:'sym',   n:'No red-flag symptoms', d:'No leaking, no heaviness or dragging in the pelvis, no doming down the midline, no pelvic or low-back pain, no bleeding beyond 8 weeks.'},
  {id:'walk',  n:'Walk 30 min', d:'Brisk, continuous, symptom-free.'},
  {id:'bal',   n:'Single-leg balance 10 s', d:'Each leg, eyes open, no wobble.'},
  {id:'sls',   n:'Single-leg squat × 10', d:'Each side, knee tracking straight.'},
  {id:'jog',   n:'Jog on the spot 1 min', d:'Symptom-free.'},
  {id:'bound', n:'Forward bounds × 10', d:'Land soft and controlled.'},
  {id:'hop',   n:'Single-leg hop in place × 10', d:'Each leg.'},
  {id:'rm',    n:'Single-leg “running man” × 10', d:'Each side, opposite arm and leg, holding balance.'},
  {id:'calf',  n:'Single-leg calf raise × 20', d:'Each leg, full height.'},
  {id:'bridge',n:'Single-leg bridge × 20', d:'Each leg, hips level.'},
  {id:'sts',   n:'Single-leg sit-to-stand × 20', d:'Each leg, from a chair.'},
  {id:'abd',   n:'Side-lying leg raise × 20', d:'Each side.'}
];
function runReadyCount(){ const r=S.runReady||{}; return RUN_READY.filter(x=>r[x.id]).length; }
function runReadyOK(){ return runReadyCount()===RUN_READY.length; }
function rRunReadyCard(){
  if(P.id!=='forger') return '';
  const r=S.runReady||{}, n=runReadyCount(), ok=runReadyOK();
  return '<div class="card mt12'+(ok?' goodc':'')+'"><div class="between"><span class="klabel'+(ok?' good-t':'')+'">Run-ready check</span>'+
      '<span class="chip '+(ok?'goodc':'dimc')+' num">'+n+' / '+RUN_READY.length+(ok?' ✓':'')+'</span></div>'+
    '<div class="fine mt6">'+(ok
      ? 'All clear. Running, bone jumps and the impact work are open. Any symptom comes back — stop, untick, and see a pelvic health physio.'
      : 'Postnatal return-to-running guideline. Tick each one you can do without symptoms. Until they are all green, keep cardio to walking and the bike, and skip the bone jumps.')+'</div>'+
    RUN_READY.map(x=>'<button class="strow" data-a="rr-toggle" data-id="'+x.id+'">'+
      '<span class="chip '+(r[x.id]?'goodc':'dimc')+'" style="width:34px;justify-content:center">'+(r[x.id]?'✓':'')+'</span>'+
      '<span class="stm"><b>'+esc(x.n)+'</b><span>'+esc(x.d)+'</span></span></button>').join('')+
    (n? '<button class="chip dimc mt10" data-a="rr-reset">Reset the check</button>':'')+
  '</div>';
}
/* ---------- weekly miles, last 8 weeks ---------- */
function runWeeksSVG(){
  const t=todayS(), mon=monOf(t);
  const weeks=[]; let d=parseD(mon);
  for(let i=0;i<8;i++){ const ws=fmtD(d); weeks.unshift(ws); d=new Date(d.getTime()-7*86400000); }
  const vals=weeks.map(ws=>{ const we=fmtD(new Date(parseD(ws).getTime()+6*86400000)); let m=0;
    for(const r of S.runs) if(r.date>=ws && r.date<=we) m+=r.meters; return m/MI; });
  const max=Math.max(1, ...vals);
  const W=340,H=110,pad=14,bw=(W-pad*2)/8;
  let bars='';
  vals.forEach((v,i)=>{ const h=Math.round((H-30)*v/max); const x=pad+i*bw+4, y=H-18-h;
    bars+='<rect x="'+x+'" y="'+y+'" width="'+(bw-8)+'" height="'+h+'" rx="4" fill="'+(i===7?'var(--accent)':'var(--panel2)')+'" stroke="var(--line)"/>'+
      (v>0? '<text x="'+(x+(bw-8)/2)+'" y="'+(y-4)+'" text-anchor="middle" class="mk">'+v.toFixed(1)+'</text>':'')+
      '<text x="'+(x+(bw-8)/2)+'" y="'+(H-5)+'" text-anchor="middle" class="mk">'+(i===7?'now':(7-i)+'w')+'</text>'; });
  return '<svg class="mapsvg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+bars+'</svg>';
}

/* ---------- coach + plan UI ---------- */
function rCoachCard(){
  const c = coachCfg();
  const sel = UI.planId || 'free';
  const tp = c.targetPace;
  return '<div class="card mt12"><div class="between"><span class="klabel">Coach</span>'+
      '<button class="chip'+(c.on?' goodc':' dimc')+'" data-a="coach-on">'+(c.on?'On ✓':'Off')+'</button></div>'+
    '<button class="btn mt10" data-a="nav" data-v="voice">🎙 Coach voice · '+CUES.filter(q=>VOICE.urls[q.k]).length+' of '+CUES.length+' lines recorded</button>'+
    '<div class="steplab mt10">Talk to me every</div>'+
    '<div class="seg mt6">'+
      [['half','½ mile'],['mile','Mile'],['5min','5 min']].map(([v,l])=>
        '<button class="'+(c.every===v?'on':'')+'" data-a="coach-every" data-v="'+v+'">'+l+'</button>').join('')+
    '</div>'+
    '<div class="steplab mt10">Style</div>'+
    '<div class="seg mt6">'+
      [['coach','Coach'],['brief','Just numbers'],['off','Silent']].map(([v,l])=>
        '<button class="'+(c.style===v?'on':'')+'" data-a="coach-style" data-v="'+v+'">'+l+'</button>').join('')+
    '</div>'+
    '<div class="steplab mt10">Target pace · min/mi</div>'+
    '<div class="row mt6" style="gap:8px">'+
      '<button class="chip" data-a="coach-tp" data-d="-15">−15s</button>'+
      '<span class="chip num" style="flex:1;text-align:center">'+(tp? fmtDur(tp)+' /mi' : 'No target')+'</span>'+
      '<button class="chip" data-a="coach-tp" data-d="15">+15s</button>'+
      (tp? '<button class="chip dimc" data-a="coach-tp" data-d="0">Clear</button>':'')+
    '</div>'+
    '<div class="steplab mt14">Words that get you out the door</div>'+
    '<textarea class="field mt6" id="coach-lines" rows="3" placeholder="One line each. The coach reads them at the miles, in order.&#10;e.g. You are stronger than this hill.">'+esc((c.lines||[]).join('\n'))+'</textarea>'+
    '<div class="row mt6" style="gap:8px"><button class="chip" data-a="coach-lines-save">Save lines</button>'+
      '<span class="fine">'+((c.lines||[]).length? (c.lines.length+' saved — these replace the built-in lines') : 'Empty — the built-in '+esc(P.name)+' lines are used')+'</span></div>'+
    '<div class="steplab mt14">Session</div>'+
    RUNPLANS.filter(p=>!p.only || p.only===P.id).map(p=>'<button class="planrow'+(sel===p.id?' on':'')+'" data-a="plan-pick" data-id="'+p.id+'">'+
      '<span class="crewav">'+(p.id==='free'?'▶':Math.round(planTotal(p.id)/60))+'</span>'+
      '<span class="pm"><b>'+esc(p.name)+'</b><span>'+esc(p.desc)+'</span></span>'+
      (sel===p.id?'<span class="lr-chev">✓</span>':'<span class="lr-chev">›</span>')+
    '</button>').join('')+
  '</div>';
}
function rPhaseBar(r){
  if(!r.plan || !r.phases || !r.phases.length) return '';
  const cur = r.phases[r.phaseIdx||0]; if(!cur) return '';
  const inPhase = runElapsed() - (r.phaseStart||0);
  const left = Math.max(0, cur.sec - inPhase);
  const pct = Math.min(100, 100*inPhase/cur.sec);
  const nx = r.phases[(r.phaseIdx||0)+1];
  return '<div class="phasebar '+esc(cur.t)+'" id="rv-phase">'+
    '<div class="pt"><span class="pn">'+esc(cur.l)+'</span><span class="pc" id="rv-phleft">'+fmtDur(left)+'</span></div>'+
    '<div class="ptrack"><i style="width:'+pct.toFixed(1)+'%"></i></div>'+
    '<div class="fine mt6">'+((r.phaseIdx||0)+1)+' of '+r.phases.length+(nx? ' · next: '+esc(nx.l):' · last one')+'</div>'+
  '</div>';
}

<script>
/* =================== STRETCHING ===================
   Dynamic work goes in the warm-up. Static holds go after the session,
   30 s a side, twice through on the tight ones. Each exercise knows what
   it tightens, so the cool-down writes itself from the day's slots. */

const STRETCHDB = {

  how:['Stand or sit tall, shoulders down.','Rest one hand on top of your head.','Let the ear drift toward that shoulder; the hand only adds its own weight.'],
  cue:'Keep the opposite shoulder heavy. Never pull hard on the neck.'},
st_forward:{n:'Forward Bend',area:['Hamstrings','Lower back','Calves'],hold:30,sides:false,
  how:['Stand with feet hip-width, knees soft.','Fold forward from the hips and let the head and arms hang.','Sway gently or hold. Roll up slowly, head last.'],
  cue:'Bend the knees as much as you need. The hamstrings let go when you stop forcing it.'},
st_sidebend:{n:'Standing Side Bend',area:['Obliques','Lats','Side of the hips'],hold:20,sides:true,

  cue:'Long through the stretched side. Breathe into the ribs.'},
st_chestopen:{n:'Chest Opener',area:['Chest','Front shoulders'],hold:20,sides:false,
  how:['Clasp the hands behind the lower back.','Straighten the arms and lift the hands away from the body.','Lift the chest and squeeze the shoulder blades together.'],
  cue:'Chin level, ribs down. The lift comes from the shoulder blades, not the lower back.'},
st_cobra:{n:'Cobra',area:['Abs','Hip flexors','Spine'],hold:20,sides:false,

/* what each movement tightens */
const STRETCH_MAP = {
  floor_press:['st_chest','st_tricep'], ohp:['st_lat','st_cross','st_tricep'], lateral_raise:['st_cross'],

  band_pulldown:['st_lat'], curl:['st_forearm'], walking_lunge:['st_hipflexor','st_quad'], step_up:['st_quad','st_fig4'],

/* what each day warms up with */
const WARM_RUN = ['dy_walk','dy_legswing','dy_hipcircle','dy_calfpump','dy_highknees'];
/* same lists for both programs, so on any day you can warm up and cool down together */
const WARM_DAY = {
  lowA:['dy_cardio','dy_hipcircle','dy_legswing','dy_bwsquat','dy_lunge','st_hipflexor'],
  upA: ['dy_cardio','dy_neck','dy_armcircle','dy_reach','dy_pullapart','st_cross'],

  upB: ['dy_cardio','dy_neck','dy_armcircle','dy_reach','dy_thoracic','st_tricep']
};
const COOL_DAY = {
  lowA:['st_hipflexor','st_quad','st_forward','st_fig4','st_butterfly','st_child'],
  upA: ['st_neck','st_cross','st_tricep','st_chest','st_sidebend','st_child'],
  lowB:['st_hipflexor','st_quad','st_forward','st_hamstring','st_kneechest','st_child'],
  upB: ['st_neck','st_cross','st_tricep','st_lat','st_chestopen','st_child']
};
function warmupFor(dayKey){ return (WARM_DAY[dayKey]||[]).filter(id=>STRETCHDB[id]); }
/* a static stretch used inside a warm-up is a short hold, not a full one */
function holdFor(id, kind){ const st=STRETCHDB[id]; if(!st) return 0; return (kind==='warm' && !st.dyn) ? Math.min(st.hold, 15) : st.hold; }
function holdTxt(id, kind){ const h=holdFor(id,kind); return h>=120 ? Math.round(h/60)+' min' : h+' s'; }

function stretchesFor(exId){ return (STRETCH_MAP[exId]||[]).filter(id=>STRETCHDB[id]); }
function cooldownFor(dayKey){
  if(dayKey==='cardio') return RUN_COOLDOWN.slice();
  if(COOL_DAY[dayKey]) return COOL_DAY[dayKey].filter(id=>STRETCHDB[id]);
  const seen = {};
  for(const s of slotList(dayKey)) for(const id of stretchesFor(s.id)) seen[id]=1;
  const list = ST_ORDER.filter(id=>seen[id]);
  if(list.length>6){ list.length=6; }
  if(list.indexOf('st_child')<0) list.push('st_child');
  return list;
}
function stretchMinutes(ids, kind){
  let sec=0; for(const id of ids){ const st=STRETCHDB[id]; if(st) sec+= holdFor(id,kind)*(st.sides?2:1); }
  return sec? Math.max(1, Math.round(sec/60)) : 0;
}
function stretchChips(exId){
  const ids = stretchesFor(exId);
  if(!ids.length) return '';
  return '<div class="card"><span class="klabel">Stretch after</span><div class="stchips">'+
    ids.map(id=>'<button class="chip" data-a="st-one" data-id="'+id+'">'+esc(STRETCHDB[id].n)+'</button>').join('')+
    '</div><div class="fine mt6">30 s each side after the session, while the muscle is warm.</div></div>';
}

/* ---------- the player ---------- */
const ST = {list:[], i:0, side:0, left:0, run:false, timer:null, back:'home', label:'Cool-down', kind:'cooldown', onDone:null};
function stretchStart(ids, label, back, kind){
  ST.list = ids.filter(id=>STRETCHDB[id]); if(!ST.list.length) return;
  ST.i=0; ST.side=0; ST.run=true; ST.back=back||UI.view; ST.label=label||'Cool-down'; ST.kind=kind||'cooldown';
  ST.left = holdFor(ST.list[0], ST.kind);
  unlockAudio();
  nav('stretch');
  stretchSay();
  stretchTick(true);
}
function stretchCur(){ return STRETCHDB[ST.list[ST.i]]; }
function stretchSay(){
  const st = stretchCur(); if(!st) return;
  const side = st.sides ? (ST.side? ' Second side.':' First side.') : '';
  const hh = holdFor(ST.list[ST.i], ST.kind), len = hh>=120 ? Math.round(hh/60)+' minutes' : hh+' seconds';
  const own = !ST.side && VOICE.urls['st:'+ST.list[ST.i]];
  say(st.n+' · '+len+(side?' ·'+side:'')+' — '+st.cue, true, own ? 'st:'+ST.list[ST.i] : (ST.side ? 'switch' : (st.dyn ? 'next' : 'hold')));
}
function stretchTick(reset){
  if(ST.timer){ clearInterval(ST.timer); ST.timer=null; }
  if(!reset && !ST.run) return;
  ST.timer = setInterval(()=>{
    if(!ST.run) return;
    ST.left -= 1;
    const el=$('#st-clock'); if(el){ el.textContent=ST.left; el.classList.toggle('warn', ST.left<=5); }
    if(ST.left<=3 && ST.left>0) countIn(ST.left);
    if(ST.left<=0) stretchAdvance();
  }, 1000);
}
function stretchAdvance(){
  const st = stretchCur();
  try{ beep(); }catch(e){}
  if(st.sides && ST.side===0){ ST.side=1; ST.left=holdFor(ST.list[ST.i], ST.kind); }
  else {
    ST.i += 1; ST.side=0;
    if(ST.i >= ST.list.length){ stretchFinish(); return; }
    ST.left = holdFor(ST.list[ST.i], ST.kind);
  }
  render(); stretchSay();
}
function stretchFinish(){
  if(ST.timer){ clearInterval(ST.timer); ST.timer=null; }
  ST.run=false;
  if(ST.onDone){ try{ ST.onDone(ST.list.slice()); }catch(e){} ST.onDone=null; }
  const mins = stretchMinutes(ST.list);
  S.stretches = S.stretches||[];
  S.stretches.push({date:todayS(), kind:ST.kind, min:mins});
  if(S.stretches.length>200) S.stretches.splice(0, S.stretches.length-200);
  save();
  say('Done. Nice work.', true, 'done');
  UI.view = ST.back==='stretch' ? 'home' : ST.back;
  render();
  toast('Stretched '+mins+' min ✓');
}
function stretchStop(){
  if(ST.timer){ clearInterval(ST.timer); ST.timer=null; }
  ST.run=false; shutUp();
  if(ST.onDone){ try{ ST.onDone(ST.list.slice(0, ST.i)); }catch(e){} ST.onDone=null; }
  UI.view = ST.back==='stretch' ? 'home' : ST.back; render();
}
function rStretch(){
  const st = stretchCur(); if(!st) return '<div class="card">Nothing to stretch.</div>';
  const n=ST.list.length;
  const prog = ST.list.map((id,k)=>'<i class="'+(k<ST.i?'done':k===ST.i?'now':'')+'"></i>').join('');
  return '<div class="stwrap">'+
    '<div class="sthead"><button class="btn small ghost" data-a="st-stop">‹ Stop</button>'+
      '<span class="klabel">'+esc(ST.label)+' · '+(ST.i+1)+' of '+n+'</span>'+
      '<button class="btn small ghost" data-a="st-skip">Skip ›</button></div>'+
    '<div class="stprog">'+prog+'</div>'+
    '<div class="stfig">'+figSVG(ST.list[ST.i],{})+'</div>'+
    '<div class="stclock'+(ST.left<=5?' warn':'')+'" id="st-clock">'+ST.left+'</div>'+
    '<div class="stside">'+(st.sides? (ST.side? '<b>Second side</b>':'<b>First side</b>')+' · '+holdTxt(ST.list[ST.i],ST.kind)+' each' : (st.dyn? 'keep moving · ':'')+holdTxt(ST.list[ST.i],ST.kind)+(st.dyn?'':' hold'))+'</div>'+
    '<div class="disp h2 mt14" style="text-align:center">'+esc(st.n)+'</div>'+
    '<div class="mmmini">'+muscleMapSVG({primary:musRegions(st.area.slice(0,1)), secondary:musRegions(st.area.slice(1))})+'</div>'+
    '<div class="stchips" style="justify-content:center">'+st.area.map(a=>'<span class="chip dimc">'+esc(a)+'</span>').join('')+'</div>'+
    '<div class="card mt12"><ol style="margin:0;padding-left:18px">'+st.how.map(h=>'<li>'+esc(h)+'</li>').join('')+'</ol>'+
      '<div class="fine mt10"><b>Cue:</b> '+esc(st.cue)+'</div></div>'+
    '<div class="stctl">'+
      '<button class="btn" data-a="st-add">+15 s</button>'+
      '<button class="btn '+(ST.run?'':'primary')+'" data-a="st-pause">'+(ST.run?'Pause':'Resume')+'</button>'+
      '<button class="btn" data-a="st-next">Next</button>'+
    '</div><div style="height:16px"></div></div>';
}
/* weeks in a row with at least 3 sessions (lifts, runs, stretch sessions) */
function weekStreak(){
  const per = {};
  const add = d => { if(!d) return; const m = monOf(d); per[m] = (per[m]||0)+1; };
  for(const w of (S.workouts||[])) add(w.date);
  for(const r of (S.runs||[])) add(r.date);
  for(const x of (S.stretches||[])) if(x.kind!=='session') add(x.date);
  let wk = monOf(todayS()), n = 0;
  if((per[wk]||0) < 3) wk = fmtD(new Date(parseD(wk).getTime()-7*86400000));
  while((per[wk]||0) >= 3){ n++; wk = fmtD(new Date(parseD(wk).getTime()-7*86400000)); }
  return {weeks:n, thisWeek: per[monOf(todayS())]||0};
}

/* ---------- hooks ---------- */
document.addEventListener('click', function(e){
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a;
  switch(a){
    case 'st-one':       stretchStart([b.dataset.id], 'Stretch', UI.view==='stretch'?'home':UI.view, 'single'); break;
    case 'who-open':     UI.view='choose'; render(); break;
    case 'st-lift':      if(S.active) nav('player'); else startDay(b.dataset.k); break;
    case 'st-run':       UI.planId=b.dataset.k; nav('run'); break;
    case 'tips-hide':    S.tipsSeen=true; save(); render(true); break;
    case 'run-warm':     stretchStart(WARM_RUN, 'Run warm-up', 'run', 'warm'); break;
    case 'who-pick':     switchProfile(b.dataset.id); break;
    case 'bf-toggle':    S.profile.breastfeeding=!S.profile.breastfeeding; save(); render(true); toast(S.profile.breastfeeding?'Targets raised for breastfeeding':'Back to the base targets'); break;
    case 'stretch-reset':stretchStart(RESET_FLOW, 'Everyday mobility reset', UI.view, 'reset'); break;
    case 'stretch-run':  stretchStart(RUN_COOLDOWN, 'Runner\u2019s cool-down', UI.view, 'run'); break;
    case 'stretch-day':  { const k=b.dataset.k; stretchStart(cooldownFor(k), 'Cool-down', UI.view, 'cooldown'); break; }
    case 'st-stop':      stretchStop(); break;
    case 'st-skip': case 'st-next': if(ST.list.length){ ST.left=0; stretchAdvance(); } break;
    case 'st-add':       ST.left+=15; render(true); break;
    case 'st-pause':     ST.run=!ST.run; if(ST.run) stretchTick(true); render(true); break;
  }
});
